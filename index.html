  function clientListHtml(filterText){
    const q = (filterText||'').trim().toLowerCase();
    const list = state.data.clients
      .filter(c => !q || [c.name, c.address, c.neighborhood, c.city, c.contactName, c.clientNumber].some(v => (v||'').toLowerCase().includes(q)))
      .sort((a,b)=>a.name.localeCompare(b.name));
    if(!list.length) return `<div class="empty-state">${icon('clients')}<p>${state.data.clients.length ? 'Nenhum cliente encontrado.' : 'Ainda não há clientes registados.'}</p></div>`;
    return list.map(c=>{
      const s = clientStats(c.id);
      const contactLine = clientContactLine(c);
      const editing = state.gpsEdit.clientId === c.id;
      return `
        <div class="stack" style="gap:0;">
          <div class="client-card">
            <div>
              <div class="client-name">${esc(c.name)}${clientNumTag(c)}</div>
              <div class="client-addr">${esc(clientLocationText(c))}${c.lat!=null ? ` · <a href="${mapLink(c.lat,c.lng)}" target="_blank" rel="noopener">ver mapa</a>` : ''}</div>
              ${contactLine ? `<div class="client-addr">${contactLine}</div>` : ''}
              <div class="client-recency">${s.count ? `${s.count} visita(s) · ${fmtRecency(s.last)}` : 'nunca visitado'}</div>
              ${clientTagsHtml(c)}
            </div>
            <div class="stack" style="gap:6px; align-items:stretch;">
              <button class="btn btn-secondary btn-sm" onclick="App.startVisitFor('${c.id}')">Visitar</button>
              <button class="btn btn-ghost btn-sm" onclick="App.toggleGpsEdit('${c.id}')">${icon('crosshair')} ${editing ? 'Fechar' : (c.lat!=null ? 'Editar GPS' : 'Definir GPS')}</button>
            </div>
          </div>
          ${editing ? `<div id="gpsEditPanel" style="margin-top:8px;">${gpsEditPanelHtml(c)}</div>` : ''}
        </div>
      `;
    }).join('');
  }
  function gpsEditPanelHtml(c){
    const g = state.gpsEdit;
    const manual = parseLatLng(g.text);
    const cand = g.gps ? { lat:g.gps.lat, lng:g.gps.lng } : manual;
    const cur = c.lat!=null ? { lat:Number(c.lat), lng:Number(c.lng) } : null;
    let info = '';
    if(cand){
      const dist = cur ? Math.round(haversineMeters(cur.lat, cur.lng, cand.lat, cand.lng)) : null;
      info = `<div class="hint" style="margin:0;">Novo GPS: <span class="mono">${cand.lat.toFixed(6)}, ${cand.lng.toFixed(6)}</span>${g.gps && g.gps.accuracy!=null ? ` (±${g.gps.accuracy} m)` : ''} · <a href="${mapLink(cand.lat,cand.lng)}" target="_blank" rel="noopener">ver no mapa</a>${dist!=null ? ` · a ${dist>=1000 ? (dist/1000).toFixed(1)+' km' : dist+' m'} do GPS atual` : ''}</div>
        ${gpsOutsideMz(cand.lat, cand.lng) ? `<div class="chip status-warn">${icon('warn')} Fora de Moçambique — confirme se a latitude e a longitude não estão trocadas.</div>` : ''}
        ${dist!=null && dist>1000 ? `<div class="chip status-warn">${icon('warn')} Muito longe do GPS atual — confirme antes de guardar.</div>` : ''}`;
    }else if(g.text.trim()){
      info = `<div class="hint" style="margin:0; color:var(--status-bad-fg);">Escreva a latitude e a longitude, por exemplo: -25.9653, 32.5892</div>`;
    }
    return `
      <div class="card stack" style="gap:10px;">
        <div class="section-title" style="margin:0;">GPS de ${esc(c.name)}</div>
        <div class="hint" style="margin:0;">${cur ? `GPS atual: <span class="mono">${cur.lat.toFixed(6)}, ${cur.lng.toFixed(6)}</span> · <a href="${mapLink(cur.lat,cur.lng)}" target="_blank" rel="noopener">ver mapa</a>${c.gpsUpdatedBy ? ` · atualizado por ${esc(c.gpsUpdatedBy)}${c.gpsUpdatedAt ? ' em ' + esc(fmtDateOnly(localDateStr(c.gpsUpdatedAt))) : ''}` : ''}` : 'Este cliente ainda não tem GPS.'}</div>
        <button class="btn btn-secondary btn-sm" onclick="App.gpsEditCapture()">${icon('crosshair')} ${g.gpsStatus==='loading' ? 'A obter localização…' : g.gps ? 'Localização capturada — capturar novamente' : 'Usar a minha localização atual'}</button>
        ${g.gpsStatus==='error' ? `<div class="hint" style="margin:0;">Não foi possível obter a localização. Pode escrever as coordenadas abaixo.</div>` : ''}
        <div class="field" style="margin:0;">
          <label for="gpsEditText">Ou escreva as coordenadas (latitude, longitude)</label>
          <input type="text" id="gpsEditText" inputmode="text" placeholder="ex: -25.9653, 32.5892" value="${esc(g.text)}" oninput="App.gpsEditText(this.value)" />
        </div>
        <div id="gpsEditInfo" class="stack" style="gap:6px;">${info}</div>
        <div class="row-wrap">
          <button class="btn btn-primary btn-sm" onclick="App.gpsEditSave()">Guardar GPS</button>
          <button class="btn btn-ghost" onclick="App.toggleGpsEdit('${c.id}')">Cancelar</button>
        </div>
      </div>`;
  }

  // Lê as linhas de "Disponibilidade e preço na prateleira": { items, error:{msg,row}|null }
  function readProductChecks(selector){
    const items = []; let error = null;
    document.querySelectorAll(selector).forEach(row=>{
      row.classList.remove('invalid');
      const product = row.querySelector('.nv-prod-name').value.trim();
      const unitRaw = row.querySelector('.nv-prod-unit').value.trim();
      const boxRaw = row.querySelector('.nv-prod-box').value.trim();
      const legacy = row.dataset.legacyPrice || '';
      const fail = msg=>{ row.classList.add('invalid'); if(!error) error = { msg, row }; };
      if(!product){ if(unitRaw || boxRaw) fail('Escolha o produto na linha com preço.'); return; }
      const u = unitRaw ? parsePriceNum(unitRaw) : null, b = boxRaw ? parsePriceNum(boxRaw) : null;
      if((unitRaw && (u==null || u<=0)) || (boxRaw && (b==null || b<=0))){ fail('Preço inválido. Use apenas números, ex: 55 ou 55,50.'); return; }
      const it = { product, available: row.querySelector('.nv-prod-avail').value === 'sim' };
      if(unitRaw) it.priceUnit = unitRaw;
      if(boxRaw) it.priceBox = boxRaw;
      if(!unitRaw && !boxRaw && legacy) it.price = legacy;
      items.push(it);
    });
    return { items, error };
  }

  // Lê os campos de entrega; devolve { delivery } ou { error }
  function readDeliveryFields(prefix, hasOrder, minIso){
    if(!hasOrder) return { delivery:null };
    const st = document.getElementById(prefix+'Status')?.value || 'pendente';
    if(st!=='entregue') return { delivery:{ status:'pendente', deliveredAt:null } };
    const raw = document.getElementById(prefix+'At')?.value || '';
    const iso = fromLocalInputValue(raw) || nowIso();
    if(new Date(iso).getTime() > Date.now() + 5*60000) return { error:'A data da entrega não pode estar no futuro.' };
    if(minIso && new Date(iso).getTime() < new Date(minIso).getTime() - 5*60000) return { error:'A entrega não pode ser anterior à visita em que a encomenda foi feita.' };
    return { delivery:{ status:'entregue', deliveredAt:iso } };
  }
  /* ----- Concorrência: v.competition = [{competitor, product, price}], v.noCompetition = true se não há concorrentes no cliente ----- */
  function parsePriceNum(x){
    let t = String(x==null?'':x).replace(/\s/g,'').replace(/[^\d.,-]/g,'');
    if(!t) return null;
    if(t.includes(',') && t.includes('.')) t = t.replace(/\./g,'').replace(',','.');
    else t = t.replace(',','.');
    const n = parseFloat(t);
    return isFinite(n) ? n : null;
  }
  function fmtMT(n){ return n.toLocaleString('pt-PT',{ minimumFractionDigits:2, maximumFractionDigits:2 }) + ' MT'; }
  function priceText(raw){ const n = parsePriceNum(raw); return n==null ? (raw ? esc(raw) : '') : fmtMT(n); }
  function compCatalog(){ return state.data.competitorProducts || []; }
  function compById(id){ return id ? compCatalog().find(x=>x.id===id) : null; }
  // nomes atuais (o catálogo do gestor manda; a visita guarda cópia para o caso de o produto ser removido)
  function compResolve(c){
    const x = compById(c.compId);
    return { competitor: (x ? x.competitor : c.competitor) || '', product: (x ? x.product : c.product) || '', category: x ? compCat(x) : FALLBACK_CATEGORY, priceUnit: c.priceUnit||'', priceBox: c.priceBox||'', price: c.price||'' };
  }
  // categoria do produto concorrente (lista partilhada com os produtos PRIME ROUTE); sem categoria válida -> "Outros"
  function compCat(x){ return (x && productCategories().includes(x.category)) ? x.category : FALLBACK_CATEGORY; }
  // grupos por categoria (ordem das categorias do gestor), ordenados por concorrente e produto
  function competitorCatGroups(onlyActive){
    const g = {};
    compCatalog().filter(c=> !onlyActive || c.active!==false).forEach(c=>{ (g[compCat(c)] = g[compCat(c)] || []).push(c); });
    return productCategories().filter(k=>g[k] && g[k].length).map(k=>({ name:k, items:g[k].sort((a,b)=>a.competitor.localeCompare(b.competitor) || a.product.localeCompare(b.product)) }));
  }
  function competitorNames(){
    const seen = {};
    compCatalog().forEach(c=>{ const k=c.competitor.toLowerCase(); if(!seen[k]) seen[k]=c.competitor; });
    return Object.values(seen).sort((a,b)=>a.localeCompare(b));
  }
  function competitorGroups(onlyActive){
    const g = {};
    compCatalog().filter(c=> !onlyActive || c.active!==false).forEach(c=>{
      const k = c.competitor.toLowerCase();
      (g[k] = g[k] || { name:c.competitor, items:[] }).items.push(c);
    });
    return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>({ ...x, items:x.items.sort((a,b)=>a.product.localeCompare(b.product)) }));
  }
  function competitionRowHtml(c){
    c = c || {};
    const cur = c.compId ? compById(c.compId) : null;
    let legacy = '';
    if(!cur && (c.competitor||c.product)){
      legacy = `<option value="__legacy" selected data-c="${esc(c.competitor||'')}" data-p="${esc(c.product||'')}">${esc(c.product||'produto')} — ${esc(c.competitor||'')} (fora da lista)</option>`;
    }
    const groups = competitorCatGroups(true);
    let inactive = '';
    if(cur && cur.active===false) inactive = `<option value="${esc(cur.id)}" selected>${esc(cur.product)} — ${esc(cur.competitor)} (inativo)</option>`;
    return `
      <div class="comp-row" ${(!c.priceUnit && !c.priceBox && c.price) ? `data-legacy-price="${esc(c.price)}"` : ''}>
        <select class="nv-comp-sel" aria-label="Produto concorrente">

  function competitionFieldsHtml(prefix, visit){

  function readCompetition(prefix){
    const none = !!document.getElementById(prefix+'NoComp')?.checked;
    if(none) return { competition:[], noCompetition:true };
    const competition = [];
    let error = null;
    document.querySelectorAll('#'+prefix+'Comp .comp-row').forEach(row=>{
      row.classList.remove('invalid');
      const sel = row.querySelector('.nv-comp-sel');
      const unitRaw = row.querySelector('.nv-comp-unit').value.trim();
      const boxRaw = row.querySelector('.nv-comp-box').value.trim();
      const legacyPrice = row.dataset.legacyPrice || '';
      const fail = msg=>{ row.classList.add('invalid'); if(!error) error = { msg, row }; };
      if(!sel.value){
        if(unitRaw || boxRaw) fail('Escolha o produto concorrente na linha com preço.');
        return; // linha vazia: ignorada
      }
      if(!unitRaw && !boxRaw && !legacyPrice){ fail('Indique o preço da unidade e/ou da caixa do produto concorrente.'); return; }
      const u = unitRaw ? parsePriceNum(unitRaw) : null, b = boxRaw ? parsePriceNum(boxRaw) : null;
      if((unitRaw && (u==null || u<=0)) || (boxRaw && (b==null || b<=0))){ fail('Preço inválido. Use apenas números, ex: 55 ou 55,50.'); return; }
      const entry = (sel.value==='__legacy')
        ? { competitor: sel.selectedOptions[0].dataset.c||'', product: sel.selectedOptions[0].dataset.p||'' }
        : (()=>{ const x = compById(sel.value); return x ? { compId:x.id, competitor:x.competitor, product:x.product } : null; })();
      if(!entry) return;
      if(unitRaw) entry.priceUnit = unitRaw;
      if(boxRaw) entry.priceBox = boxRaw;
      if(!unitRaw && !boxRaw && legacyPrice) entry.price = legacyPrice;
      competition.push(entry);
    });
    return { competition, noCompetition:false, error };

  /* ----- Distribuição numérica: % dos clientes onde o produto estava em stock (última verificação de cada cliente) ----- */
  // base de cada produto = clientes onde ele foi verificado no período; em stock = última verificação do cliente diz "Em stock"
  function numericDistribution(visits, canal, tipo, onlyNames){
    const names = onlyNames ? new Set(onlyNames) : null;
    const sorted = visits.filter(v=>visitMatchCT(v, canal||'', tipo||'')).slice().sort((a,b)=> a.timestamp<b.timestamp ? -1 : 1);
    const latest = new Map(); const clientsAny = new Set();
    sorted.forEach(v=>(v.productChecks||[]).forEach(x=>{
      if(!x.product || (names && !names.has(x.product))) return;
      latest.set(v.clientId + '|' + x.product, !!x.available);
      clientsAny.add(v.clientId);
    }));
    const stat = {};
    latest.forEach((avail, key)=>{ const name = key.slice(key.indexOf('|')+1); const o = stat[name] = stat[name] || { present:0, base:0 }; o.base++; if(avail) o.present++; });
    const catalog = state.data.products || [];
    const catOf = name => { const p = catalog.find(x=>x.name===name); return p ? (productCategories().includes(p.category) ? p.category : FALLBACK_CATEGORY) : FALLBACK_CATEGORY; };
    const all = new Set([...(names ? [...names] : catalog.filter(p=>p.active!==false).map(p=>p.name)), ...Object.keys(stat)]);
    const rows = [...all].map(name=>{ const o = stat[name] || { present:0, base:0 }; return { name, category:catOf(name), present:o.present, base:o.base, pct: o.base ? Math.round(o.present/o.base*100) : null }; });
    const withData = rows.filter(r=>r.base>0).sort((a,b)=> b.pct-a.pct || b.base-a.base || a.name.localeCompare(b.name));
    const noData = rows.filter(r=>!r.base).sort((a,b)=>a.name.localeCompare(b.name));
    return { rows: withData, noData, clients: clientsAny.size };

  /* ============ PORTFÓLIO (vendedor e gestor): consultar, exportar PDF, partilhar ============ */
  const APP_NAME_FULL = 'Prime Route Distribuidora, SA';
  function portfolioGroups(cat, search){
    const q = (search||'').trim().toLowerCase();
    const products = (state.data.products && state.data.products.length) ? state.data.products : defaultProductObjs();
    const groups = {};
    products.forEach(p=>{
      if(p.active === false) return;
      const c = productCategories().includes(p.category) ? p.category : 'Outros';
      if(cat && c !== cat) return;
      if(q && !(p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q))) return;
      (groups[c] = groups[c] || []).push(p);
    });
    return productCategories().filter(c=>groups[c] && groups[c].length).map(c=>({ category:c, products:groups[c] }));
  }
  function portfolioCardHtml(p){
    const img = productImageOf(p.name);
    return `
      <div class="pf-card">
        <div class="pf-img">${img ? `<img src="${img}" alt="${esc(p.name)}" loading="lazy" />` : `<span class="pf-ph">${icon('box')}<span>Sem imagem</span></span>`}</div>
        <div class="pf-info">
          <div class="pf-name">${esc(p.name)}</div>
          ${p.description ? `<div class="pf-desc">${esc(p.description)}</div>` : ''}
        </div>
      </div>`;
  }
  function portfolioText(groups, maxLen){
    const lines = [`Portfólio de produtos — ${APP_NAME_FULL}`, ''];
    groups.forEach(g=>{
      lines.push(g.category.toUpperCase());
      g.products.forEach(p=> lines.push(`• ${p.name}${p.description ? ' — ' + p.description : ''}`));
      lines.push('');
    });
    let text = lines.join('\n').trim();
    if(maxLen && text.length > maxLen){ text = text.slice(0, maxLen).replace(/\n[^\n]*$/, '') + '\n…\n(lista completa no PDF)'; }
    return text;
  }
  function portfolioShareHtml(groups){
    if(!groups.length) return '';
    const waText = portfolioText(groups, 3500);
    const mailBody = portfolioText(groups, 1500);
    const subject = `Portfólio de produtos — ${APP_NAME_FULL}`;
    return `
      <div class="row-wrap" style="gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="App.exportPortfolioPdf()">${icon('download')} Exportar PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="App.sharePortfolioPdf()">${icon('share')} Partilhar PDF</button>
        <a class="btn btn-secondary btn-sm" style="text-decoration:none;" href="https://wa.me/?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener">${icon('share')} WhatsApp</a>
        <a class="btn btn-secondary btn-sm" style="text-decoration:none;" href="mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(mailBody)}">${icon('mail')} Email</a>
      </div>
      <div class="hint">WhatsApp e Email enviam a lista em texto. Para enviar o ficheiro com as imagens, use "Partilhar PDF" (telemóvel) ou exporte o PDF e anexe-o.</div>`;
  }
  function viewPortfolio(){
    const isManager = state.session && state.session.role==='manager';
    const all = portfolioGroups('', '');
    const cats = all.map(g=>g.category);
    const noImg = all.reduce((n,g)=> n + g.products.filter(p=>!productImageOf(p.name)).length, 0);
    return `
      <div class="stack">
        <h2>Portfólio</h2>
        <p class="hint">Produtos e marcas disponíveis da ${esc(APP_NAME_FULL)}, por categoria. Pode exportar em PDF e partilhar por WhatsApp ou email (respeita a categoria e a pesquisa escolhidas).</p>

  function applyPortfolioFilter(){
    const input = document.getElementById('pfSearch');
    if(input && state.pf.search && !input.value) input.value = state.pf.search;
    const search = input ? input.value : state.pf.search;
    const groups = portfolioGroups(state.pf.cat, search);

  function buildPortfolioPdf(groups){
    const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;

    const doc = new jsPDFCtor({ unit:'mm', format:'a4' });
    const W = 210, H = 297, M = 14, GAP = 6, COLS = 3;
    const cellW = (W - 2*M - GAP*(COLS-1)) / COLS;
    const IMG_H = 46;
    const NAVY = [41,40,118], ORANGE = [203,98,62], INK = [28,36,48], MUTED = [110,120,135];
    const dateTxt = fmtDateOnly(todayDateStr());
    const catFiltered = state.pf.cat ? state.pf.cat : '';

    // Cabeçalho (1ª página)
    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 36, 'F');

    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.text('Portfólio de Produtos', M+30, 17);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(APP_NAME_FULL, M+30, 24);
    doc.setFontSize(9); doc.setTextColor(210,212,235);
    doc.text(dateTxt + (catFiltered ? '  |  Categoria: ' + catFiltered : ''), M+30, 30);
    doc.setFillColor(...ORANGE); doc.rect(0, 36, W, 1.6, 'F');

    let y = 46;
    const newPage = ()=>{
      doc.addPage();
      doc.setFillColor(...NAVY); doc.rect(0, 0, W, 10, 'F');
      doc.setFillColor(...ORANGE); doc.rect(0, 10, W, 0.9, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text('Portfólio de Produtos  |  ' + APP_NAME_FULL, M, 6.5);
      y = 20;
    };
    const maxY = H - 16;

    groups.forEach(g=>{
      // linhas de 3 produtos; altura de cada linha conforme o texto
      const rows = [];
      for(let i=0;i<g.products.length;i+=COLS) rows.push(g.products.slice(i, i+COLS));
      const prep = rows.map(row=>{
        const items = row.map(p=>{
          doc.setFont('helvetica','bold'); doc.setFontSize(10);
          const nameLines = doc.splitTextToSize(p.name, cellW - 2).slice(0,2);
          doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
          const descLines = p.description ? doc.splitTextToSize(p.description, cellW - 2).slice(0,3) : [];
          return { p, nameLines, descLines };
        });
        const nameN = Math.max(...items.map(it=>it.nameLines.length));
        const descN = Math.max(...items.map(it=>it.descLines.length));
        return { items, h: IMG_H + 5.5 + nameN*4.4 + (descN ? 1.2 + descN*3.7 : 0) + 7 };
      });
      if(y + 12 + prep[0].h > maxY) newPage();
      doc.setTextColor(...ORANGE); doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text(g.category, M, y);
      doc.setDrawColor(...ORANGE); doc.setLineWidth(0.4); doc.line(M, y+2, W-M, y+2);
      y += 8;
      prep.forEach(row=>{
        if(y + row.h > maxY) newPage();
        row.items.forEach((it,col)=>{
          const p = it.p;
          const x = M + col*(cellW+GAP);
          doc.setDrawColor(222,226,231); doc.setLineWidth(0.25); doc.setFillColor(255,255,255);
          doc.roundedRect(x, y, cellW, IMG_H, 2, 2, 'FD');
          const img = productImageOf(p.name);
          let drawn = false;
          if(img){
            try{
              const props = doc.getImageProperties(img);
              const pad = 2, bw = cellW - 2*pad, bh = IMG_H - 2*pad;
              const r = Math.min(bw/props.width, bh/props.height);
              const w = props.width*r, h = props.height*r;
              doc.addImage(img, 'JPEG', x + (cellW-w)/2, y + (IMG_H-h)/2, w, h);
              drawn = true;
            }catch(e){}
          }
          if(!drawn){
            doc.setFillColor(238,241,244); doc.roundedRect(x+0.6, y+0.6, cellW-1.2, IMG_H-1.2, 1.6, 1.6, 'F');
            doc.setTextColor(150,158,170); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
            doc.text('Sem imagem', x + cellW/2, y + IMG_H/2 + 1, { align:'center' });
          }
          doc.setTextColor(...INK); doc.setFont('helvetica','bold'); doc.setFontSize(10);
          doc.text(it.nameLines, x + 1, y + IMG_H + 5.5);
          if(it.descLines.length){
            doc.setTextColor(...MUTED); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
            doc.text(it.descLines, x + 1, y + IMG_H + 5.5 + it.nameLines.length*4.4 + 1.2);
          }
        });
        y += row.h;
      });
      y += 3;
    });

    // Rodapé com numeração
    const n = doc.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i);
      doc.setDrawColor(222,226,231); doc.setLineWidth(0.25); doc.line(M, H-11, W-M, H-11);
      doc.setTextColor(...MUTED); doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(APP_NAME_FULL, M, H-6.5);
      doc.text(`Página ${i} de ${n}`, W-M, H-6.5, { align:'right' });
    }
    return doc.output('blob');
  }

  async function saveBlobToUser(blob, filename){
    let dl = null;
    try{ dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
    if(dl){
      try{ await dl.save({ filename, data: blob }); return 'saved'; }
      catch(e){ if(e && e.code==='declined') return 'declined'; /* senão tenta o método direto */ }
    }
    try{

  }

  async function inflateRaw(bytes){
    if(typeof DecompressionStream === 'undefined') throw new Error('nodecomp');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function readZipIndex(u8){
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for(let i=u8.length-22; i>=Math.max(0,u8.length-66000); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd = i; break; } }
    if(eocd<0) throw new Error('zip');
    const count = dv.getUint16(eocd+10,true); let p = dv.getUint32(eocd+16,true);
    const dec = new TextDecoder(); const map = new Map();
    for(let n=0;n<count;n++){
      if(dv.getUint32(p,true)!==0x02014b50) throw new Error('zip');
      const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
      map.set(dec.decode(u8.subarray(p+46,p+46+nlen)), { method, csize, off });
      p += 46 + nlen + elen + clen;
    }
    return map;
  }
  async function zipRead(u8, index, name){
    const e = index.get(name); if(!e) return null;
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const start = e.off + 30 + dv.getUint16(e.off+26,true) + dv.getUint16(e.off+28,true);
    const raw = u8.subarray(start, start+e.csize);
    const data = e.method===0 ? raw : e.method===8 ? await inflateRaw(raw) : null;
    if(!data) throw new Error('zipmethod');
    return new TextDecoder().decode(data);
  }
  function xmlDoc(txt){
    const d = new DOMParser().parseFromString(txt, 'application/xml');
    if(d.getElementsByTagName('parsererror').length) throw new Error('xml');
    return d;
  }
  function colIndexOf(ref){ const m = /^([A-Z]+)/.exec(ref||''); if(!m) return 0; let n=0; for(const ch of m[1]) n = n*26 + (ch.charCodeAt(0)-64); return n-1; }
  function nodeText(el){ let t=''; el.querySelectorAll('t').forEach(x=>{ if(!x.closest('rPh')) t += x.textContent; }); return t; }
  async function readXlsxSheets(buf){
    const u8 = new Uint8Array(buf); const index = readZipIndex(u8);
    const sstTxt = await zipRead(u8, index, 'xl/sharedStrings.xml');
    const sst = sstTxt ? Array.from(xmlDoc(sstTxt).getElementsByTagName('si')).map(nodeText) : [];
    const wb = xmlDoc(await zipRead(u8, index, 'xl/workbook.xml'));
    const relsTxt = await zipRead(u8, index, 'xl/_rels/workbook.xml.rels');
    const rels = {}; if(relsTxt) Array.from(xmlDoc(relsTxt).getElementsByTagName('Relationship')).forEach(r=>{ rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    const out = [];
    const sheetEls = Array.from(wb.getElementsByTagName('sheet'));
    for(let si=0; si<sheetEls.length; si++){
      const sh = sheetEls[si];
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      let target = rels[rid] || ('worksheets/sheet'+(si+1)+'.xml');
      target = target.replace(/^\//,''); if(!target.startsWith('xl/')) target = 'xl/' + target;
      const txt = await zipRead(u8, index, target); if(!txt) continue;
      const doc = xmlDoc(txt); const rows = [];
      Array.from(doc.getElementsByTagName('row')).forEach(rowEl=>{
        const r = parseInt(rowEl.getAttribute('r'),10) || (rows.length+1);
        const arr = [];
        Array.from(rowEl.getElementsByTagName('c')).forEach(c=>{
          const t = c.getAttribute('t'); const vEl = c.getElementsByTagName('v')[0]; let val = '';
          if(t==='s') val = sst[parseInt(vEl ? vEl.textContent : '-1',10)] ?? '';
          else if(t==='inlineStr') val = nodeText(c);
          else if(vEl) val = vEl.textContent;
          if(t==='b') val = val==='1' ? 'Sim' : 'Não';
          if(t==='e') val = '';
          arr[colIndexOf(c.getAttribute('r'))] = String(val).trim();
        });
        rows[r-1] = arr;
      });
      out.push({ name: sh.getAttribute('name') || ('Folha '+(si+1)), rows });
    }
    return out;
  }
  function parseCsv(text){
    text = text.replace(/^﻿/,'');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = [';',',','\t'].map(d=>[d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
    const rows = []; let row = [], cur = '', q = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if(ch==='"') q = true;
      else if(ch===delim){ row.push(cur.trim()); cur=''; }
      else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur.trim()); cur=''; rows.push(row); row=[]; }
      else cur += ch;
    }
    if(cur!=='' || row.length){ row.push(cur.trim()); rows.push(row); }
    return [{ name:'CSV', rows }];
  }
  // procura a linha de cabeçalhos e devolve { map:{key:colIndex}, headerRow, ignored:[...] }
  function detectClientHeader(rows){
    for(let r=0; r<Math.min(rows.length,15); r++){
      const row = rows[r]; if(!row) continue;
      const map = {}, ignored = [];
      row.forEach((h,ci)=>{
        if(h==null || h==='') return;
        const k = normKey(h);
        const col = CLIENT_COLS.find(c=>c.aliases.includes(k) || normKey(c.label)===k);
        if(col && !(col.key in map)) map[col.key] = ci; else if(!col) ignored.push(String(h));
      });
      if('name' in map) return { map, headerRow:r, ignored };
    }
    return null;
  }
  function cleanNumText(s){ return String(s==null?'':s).trim().replace(/^'+/,'').replace(/\.0+$/,''); }
  function parseClientRows(sheetRows, hdr){
    const out = [];
    for(let r=hdr.headerRow+1; r<sheetRows.length; r++){
      const row = sheetRows[r]; if(!row || row.every(x=>x==null||x==='')) continue;
      const get = key => (key in hdr.map) ? String(row[hdr.map[key]] ?? '').trim() : '';
      const warnings = [];
      const d = {
        clientNumber: cleanNumText(get('clientNumber')), name: get('name').replace(/\s+/g,' '), address: get('address'), neighborhood: get('neighborhood'), city: get('city'),
        contactName: get('contactName'), phone: cleanNumText(get('phone')), email: get('email'), nuit: cleanNumText(get('nuit')),
        channel:'', establishmentType:'', visitFrequency:'', vendorId:'', lat:null, lng:null,
      };
      // canal / tipo
      const ck = normKey(get('channel')), tk = normKey(get('establishmentType'));
      if(ck){ if(['on','on trade','ontrade'].includes(ck)) d.channel='on'; else if(['off','off trade','offtrade'].includes(ck)) d.channel='off'; else warnings.push(`Canal "${get('channel')}" não reconhecido (use On-Trade ou Off-Trade)`); }
      if(tk){
        let found = null;
        Object.entries(ESTABLISHMENT_TYPES).forEach(([ch,list])=>list.forEach(t=>{ if(!found && normKey(t)===tk) found = { ch, t }; }));
        if(found){
          if(d.channel && d.channel!==found.ch){ warnings.push(`Tipo "${found.t}" não pertence ao canal indicado; tipo ignorado`); }
          else { d.establishmentType = found.t; if(!d.channel) d.channel = found.ch; }
        } else warnings.push(`Tipo de estabelecimento "${get('establishmentType')}" não reconhecido`);
      }
      const fk = normKey(get('visitFrequency'));
      if(fk){ const f = Object.entries(FREQ_META).find(([k,l])=>normKey(l)===fk || normKey(k)===fk); if(f) d.visitFrequency = f[0]; else warnings.push(`Frequência "${get('visitFrequency')}" não reconhecida`); }
      const vk = normKey(get('vendor'));
      if(vk){ const vv = state.data.vendors.find(v=>normKey(v.name)===vk); if(vv) d.vendorId = vv.id; else warnings.push(`Vendedor "${get('vendor')}" não existe; carteira não alterada`); }
      const num = (txt, lo, hi, label)=>{ if(!txt) return null; const n = parseFloat(String(txt).replace(',','.')); if(!isFinite(n) || n<lo || n>hi){ warnings.push(`${label} "${txt}" inválida`); return null; } return n; };
      d.lat = num(get('lat'), -90, 90, 'Latitude'); d.lng = num(get('lng'), -180, 180, 'Longitude');
      if((d.lat==null) !== (d.lng==null)){ if(d.lat!=null || d.lng!=null) warnings.push('Latitude e longitude têm de vir juntas; coordenadas ignoradas'); d.lat = null; d.lng = null; }
      out.push({ line: r+1, data:d, warnings });
    }
    return out;
  }
  // plano: classifica cada linha como novo / atualizar / sem alterações / ignorar / erro
  function planClientImport(parsed, mode){
    const clients = state.data.clients;
    const byNum = new Map(), byName = new Map();
    clients.forEach(c=>{
      const n = String(c.clientNumber||'').trim().toLowerCase(); if(n) byNum.set(n, c);
      const k = normKey(c.name); if(!byName.has(k)) byName.set(k, []); byName.get(k).push(c);
    });
    const seenNum = new Set(), seenName = new Set(), seenMatched = new Set();
    return parsed.map(row=>{
      const d = row.data; const res = { ...row, action:'new', match:null, error:null, patch:null };
      if(!d.name){ res.action='error'; res.error='Nome em falta'; return res; }
      const nk = normKey(d.name), numK = d.clientNumber.toLowerCase();
      if(numK){ if(seenNum.has(numK)){ res.action='error'; res.error=`Nº cliente ${d.clientNumber} repetido no ficheiro`; return res; } seenNum.add(numK); }
      else if(seenName.has(nk)){ res.action='error'; res.error='Nome repetido no ficheiro (sem Nº cliente)'; return res; }
      seenName.add(nk);
      let match = null;
      if(numK){
        match = byNum.get(numK) || null;
        if(!match){ const same = (byName.get(nk)||[]).filter(c=>!String(c.clientNumber||'').trim()); if(same.length===1) match = same[0]; }
      }else{
        const same = byName.get(nk) || [];
        if(same.length>1){ res.action='error'; res.error='Há vários clientes com este nome; indique o Nº cliente'; return res; }
        match = same[0] || null;
      }
      if(match){
        if(seenMatched.has(match.id)){ res.action='error'; res.error='Este cliente já aparece noutra linha do ficheiro'; return res; }
        seenMatched.add(match.id);
        res.match = match;
        // só preenche o que veio preenchido
        const patch = {};
        ['clientNumber','name','address','neighborhood','city','contactName','phone','email','nuit','channel','establishmentType','visitFrequency','vendorId'].forEach(k=>{
          if(d[k] && String(d[k])!==String(match[k]||'')) patch[k] = d[k];
        });
        if(d.lat!=null && (Number(match.lat)!==d.lat || Number(match.lng)!==d.lng)){ patch.lat = d.lat; patch.lng = d.lng; }
        if(patch.channel && !patch.establishmentType && match.establishmentType && !(ESTABLISHMENT_TYPES[patch.channel]||[]).includes(match.establishmentType)) patch.establishmentType = '';
        res.patch = patch;
        res.action = !Object.keys(patch).length ? 'same' : (mode==='ignore' ? 'skip' : 'update');
      }
      return res;
    });
  }
  function clientImportCounts(plan){
    const c = { new:0, update:0, same:0, skip:0, error:0 };
    plan.forEach(r=>{ c[r.action]++; });
    return c;
  }

            <option value="ignore" ${im.mode==='ignore'?'selected':''}>Ignorar (importar só os novos)</option>
          </select>
        </div>
        ${issues.length ? `<details ${c.error ? 'open' : ''}><summary style="cursor:pointer; font-size:13px;">${issues.length} aviso(s)/erro(s)</summary>
          <div class="stack" style="gap:4px; margin-top:6px; font-size:12px; max-height:220px; overflow:auto;">
            ${issues.slice(0,60).map(r=>`<div>Linha ${r.line}${r.data.name ? ' (' + esc(r.data.name) + ')' : ''}: ${r.error ? `<b style="color:var(--status-bad-fg);">${esc(r.error)}</b>` : ''}${r.warnings.map(w=>esc(w)).join('; ')}</div>`).join('')}

            ${plan.slice(0,15).map(r=>`<div class="row-wrap" style="gap:8px; align-items:center; font-size:13px;"><span class="chip ${actLabel[r.action][1]}">${actLabel[r.action][0]}</span><span style="min-width:0; overflow-wrap:anywhere;">${esc(r.data.name||'(sem nome)')}${r.data.clientNumber ? ' · Nº ' + esc(r.data.clientNumber) : ''}${r.action==='update' ? ' · ' + Object.keys(r.patch).filter(k=>k!=='lng').length + ' campo(s)' : ''}</span></div>`).join('')}
            ${plan.length>15 ? `<div class="hint">… e mais ${plan.length-15} linha(s).</div>` : ''}
          </div></details>
        <div class="row-wrap" style="gap:8px;">
          <button class="btn btn-primary btn-sm" ${(!todo || im.busy) ? 'disabled' : ''} onclick="App.mcImportConfirm()">${im.busy ? (im.progress||'A importar…') : `Importar ${todo} cliente(s)`}</button>

        </div>
      </div>`;
  }

  async function renameProductInVisits(oldName, newName){
    let n = 0;
    for(const v of state.data.visits.slice()){
      const hasPc = (v.productChecks||[]).some(x=>x.product===oldName);
      const hasOi = (v.orderItems||[]).some(x=>x.product===oldName);
      if(!hasPc && !hasOi) continue;
      const patch = {};
      if(hasPc) patch.productChecks = v.productChecks.map(x=> x.product===oldName ? { ...x, product:newName } : x);
      if(hasOi) patch.orderItems = v.orderItems.map(x=> x.product===oldName ? { ...x, product:newName } : x);
      await updateVisit(v.id, patch);
      n++;
    }
    return n;
  }

  /* ============ MANAGER: ENCOMENDAS DO DIA ============ */
  function dayOrdersSummary(dateStr){
    const visits = state.data.visits
      .filter(v => (v.orderItems||[]).length && localDateStr(v.timestamp) === dateStr)
      .sort((a,b)=> a.timestamp < b.timestamp ? -1 : 1);
    const totals = {};
    const order = [];
    visits.forEach(v=>{
      (v.orderItems||[]).forEach(o=>{
        const qty = parseFloat(o.quantity) || 0;
        const unit = o.unit === 'unidades' ? 'unidades' : 'caixas';
        const key = o.product + '|' + unit;
        if(!(key in totals)) order.push(key);
        totals[key] = (totals[key] || 0) + qty;
      });
    });
    return { visits, totals, order };
  }
  function buildOrdersMailtoHref(dateStr){
    const { visits, totals, order } = dayOrdersSummary(dateStr);
    const dateLabel = fmtDateOnly(dateStr);
    const lines = [`Encomendas do dia ${dateLabel}`, ''];
    if(order.length){
      lines.push('Total por produto:');
      order.forEach(key=>{
        const [product, unit] = key.split('|');
        lines.push(`- ${product}: ${totals[key]} ${unit}`);
      });
      lines.push('');
    }
    lines.push('Detalhe por visita:');
    visits.forEach(v=>{
      const cn = clientById(v.clientId);
      lines.push(`• ${v.clientName}${cn && cn.clientNumber ? ' [Nº ' + cn.clientNumber + ']' : ''} (${vendorNameOf(v)}, ${fmtDateTime(v.timestamp)})`);
      (v.orderItems||[]).forEach(o=>{
        const unit = o.unit === 'unidades' ? 'unidades' : 'caixas';
        lines.push(`   - ${o.product}: ${o.quantity} ${unit}`);
      });
    });
    const subject = `Encomendas do dia ${dateLabel}`;
    const body = lines.join('\n');
    return `mailto:${ordersEmail()}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  /* ============ MANAGER: RELATÓRIO ============ */
  /* ----- Gráficos de barras (HTML/CSS): eixo com valores, linhas de grelha, % do total e dica ao passar o rato ----- */
  const WEEKDAYS_PT = ['dom','seg','ter','qua','qui','sex','sáb'];
  function niceScale(max, target){
    target = target || 4;
    if(!(max > 0)) return { top:1, step:1, ticks:[0,1] };
    const raw = max / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const stepBase = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    const step = Math.max(1, stepBase * mag);
    const top = Math.ceil(max / step) * step;
    const ticks = [];
    for(let t=0; t<=top + 1e-9; t+=step) ticks.push(Math.round(t*100)/100);
    return { top, step, ticks };
  }
  function dateAdd(dateStr, n){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d+n);
    const pad = x => String(x).padStart(2,'0');
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  }
  function dateSpan(startStr, endStr){
    const out = [];
    for(let d=startStr, guard=0; d<=endStr && guard<400; d=dateAdd(d,1), guard++) out.push(d);
    return out;
  }
  // Barras horizontais. rows: [{name, count, color?}]. opts: {share:true, total:n, unit:'visitas'}
  function reportBarListHtml(title, rows, emptyMsg, opts){
    opts = opts || {};
    if(!rows.length) return `<div class="card"><div class="section-title">${esc(title)}</div><p class="hint">${esc(emptyMsg)}</p></div>`;
    const total = opts.total != null ? opts.total : rows.reduce((a,r)=>a+r.count,0);
    const sc = opts.scale || niceScale(Math.max(...rows.map(r=>r.count)), 4);
    return `
      <div class="card">
        <div class="section-title">${esc(title)}</div>

  function reportDateRange(period, customStart, customEnd){
    if(period==='custom') return { start: customStart || null, end: customEnd || null };
    const cutoff = periodCutoff(period);
    if(cutoff==null) return { start:null, end:null };
    const back = Math.max(0, cutoff-1); // 7d = hoje + 6 dias anteriores (dias de calendário)
    return { start: localDateStr(new Date(Date.now() - back*86400000).toISOString()), end: todayDateStr() };
  }
  async function loadReportAgendas(){

        let q = db.collection('agendas');
        if(range.start) q = q.where('date','>=',range.start);

      list = (state.data.agendas||[]).filter(a=> (!range.start || a.date>=range.start) && (!range.end || a.date<=range.end));

  function reportFilterVisits(period, customStart, customEnd){

  /* ============ EXPORTAR RELATÓRIO (PDF e Excel) ============ */
  function competitionAggregate(allVisits, canal, tipo, cat){
    const visits = allVisits.filter(v=>{
      if(!canal && !tipo) return true;
      const c = clientById(v.clientId);
      const ch = (c && c.channel) ? c.channel : '';
      const ty = (c && c.establishmentType) ? c.establishmentType : '';
      if(canal==='__none' ? !!ch : (canal && ch!==canal)) return false;
      if(tipo==='__none' ? !!ty : (tipo && ty!==tipo)) return false;
      return true;
    });
    const resolved = new Map();
    visits.forEach(v=>{ if((v.competition||[]).length) resolved.set(v, v.competition.map(compResolve).filter(c=>c.competitor)); });
    const withAny = visits.filter(v=>resolved.has(v) && resolved.get(v).length);
    const catOk = c => Array.isArray(cat) ? cat.includes(c.category) : c.category===cat;
    if(cat) withAny.forEach(v=>{ resolved.set(v, resolved.get(v).filter(catOk)); });
    const withData = cat ? withAny.filter(v=>resolved.get(v).length) : withAny;
    const otherCat = withAny.length - withData.length;
    const none = visits.filter(v=>v.noCompetition).length;
    const noRecord = visits.length - withAny.length - none;
    const comps = {};
    withData.forEach(v=>{
      const seenInVisit = new Set();
      resolved.get(v).forEach(c=>{
        const k = c.competitor.toLowerCase();
        const g = comps[k] = comps[k] || { name:c.competitor, visits:0, prods:{} };
        if(!seenInVisit.has(k)){ g.visits++; seenInVisit.add(k); }
        const pn = (c.product||'').trim();
        const pk = pn.toLowerCase() || '—';
        const pr = g.prods[pk] = g.prods[pk] || { name: pn || 'Produto não indicado', cat:c.category||FALLBACK_CATEGORY, unit:[], box:[], other:[], n:0 };
        pr.n++;
        const u = parsePriceNum(c.priceUnit), b = parsePriceNum(c.priceBox), o = parsePriceNum(c.price);
        if(u!=null) pr.unit.push(u);
        if(b!=null) pr.box.push(b);
        if(u==null && b==null && o!=null) pr.other.push(o);
      });
    });
    const list = Object.values(comps).sort((a,b)=>b.visits-a.visits || a.name.localeCompare(b.name));
    return { visits, withData, none, noRecord, otherCat, list };
  }
  function reportPeriodLabel(){

  function buildReportData(){
    const period = state.mgrReportPeriod || 'all';
    const rv = state.mgrReportVendor || '';
    const visits = currentReportVisits();
    const range = reportDateRange(period, state.mgrReportCustomStart, state.mgrReportCustomEnd);
    const today = todayDateStr();
    let dEnd = range.end || today;
    let dStart = range.start || (visits.length ? visits.map(v=>localDateStr(v.timestamp)).sort()[0] : dEnd);
    if(dStart > dEnd) dStart = dEnd;
    const days = dateSpan(dStart, dEnd);
    const vendorIds = Array.from(new Set(visits.map(v=>v.vendorId)));
    const vendorsPresent = vendorIds.map(id=>({ id, name: vendorById(id)?.name || 'Vendedor removido' })).sort((a,b)=>a.name.localeCompare(b.name));
    const perDay = {};
    visits.forEach(v=>{
      const d = localDateStr(v.timestamp);
      const o = perDay[d] = perDay[d] || { total:0, by:{} };
      o.total++; o.by[v.vendorId] = (o.by[v.vendorId]||0) + 1;
    });
    // meta
    const agendas = (state.reportAgendas || []).filter(a=> !rv || a.vendorId===rv);
    const metaByDay = {}, metaByVendor = {}; let totalMeta = 0;
    agendas.forEach(a=>{ const n=(a.clientIds||[]).length; if(!n) return; totalMeta+=n; metaByDay[a.date]=(metaByDay[a.date]||0)+n; metaByVendor[a.vendorId]=(metaByVendor[a.vendorId]||0)+n; });
    const doneByVendor = {}; visits.forEach(v=>{ doneByVendor[v.vendorId]=(doneByVendor[v.vendorId]||0)+1; });
    const daysWithMeta = Object.keys(metaByDay).length;
    const metaDays = Array.from(new Set([...Object.keys(metaByDay), ...Object.keys(perDay)])).sort()
      .map(d=>({ date:d, meta: metaByDay[d]||0, done: (perDay[d]||{}).total||0 }));
    const metaVendors = Array.from(new Set([...Object.keys(metaByVendor), ...Object.keys(doneByVendor)]))
      .map(id=>({ name: vendorById(id)?.name || 'Vendedor removido', meta: metaByVendor[id]||0, done: doneByVendor[id]||0 }))
      .sort((a,b)=> b.meta-a.meta || b.done-a.done || a.name.localeCompare(b.name));
    const counts = (keyFn)=>{ const m={}; visits.forEach(v=>{ const k=keyFn(v); m[k]=(m[k]||0)+1; }); return m; };
    const byVendor = Object.entries(counts(v=>v.vendorId)).map(([id,count])=>({ name: vendorById(id)?.name || 'Vendedor removido', count })).sort((a,b)=>b.count-a.count);
    const byChannel = Object.entries(counts(v=>{ const c=clientById(v.clientId); return (c&&c.channel)?c.channel:'—'; }))
      .map(([k,count])=>({ name: CHANNEL_META[k] ? CHANNEL_META[k].label : 'Sem canal definido', count })).sort((a,b)=>b.count-a.count);
    const byType = Object.entries(counts(v=>{ const c=clientById(v.clientId); return (c&&c.establishmentType)?c.establishmentType:'Não definido'; }))
      .map(([name,count])=>({ name, count })).sort((a,b)=>b.count-a.count);
    const prod = {}, prodOrder = [];
    visits.forEach(v=>(v.orderItems||[]).forEach(o=>{
      const qty = parseFloat(o.quantity)||0, unit = o.unit==='unidades' ? 'unidades' : 'caixas', key = o.product+'|'+unit;
      if(!(key in prod)){ prod[key] = 0; prodOrder.push(key); }
      prod[key] += qty;
    }));
    const products = prodOrder.map(k=>{ const [product,unit]=k.split('|'); return { product, unit, qty: prod[k] }; }).sort((a,b)=>b.qty-a.qty);
    const convSc = convScope(visits);
    const conv = conversionData(convSc.list, !!state.mgrConvExcl);
    const convFilter = convFilterLabel(convSc);
    // distribuição numérica
    const ndCanal = state.mgrNdCanal || '', ndTipo = state.mgrNdTipo || '';
    const nd = numericDistribution(visits, ndCanal, ndTipo);
    const ndFilter = `Canal: ${ndCanal==='__none'?'Sem canal definido':ndCanal?(CHANNEL_META[ndCanal]?.label||ndCanal):'Todos'} | Tipo: ${ndTipo==='__none'?'Não definido':ndTipo||'Todos'}`;
    // concorrência
    const canal = state.mgrCompCanal || '', tipo = state.mgrCompTipo || '';
    const cat = (state.mgrCompCat && productCategories().includes(state.mgrCompCat)) ? state.mgrCompCat : '';

  /* ----- PDF ----- */

  function buildReportPdf(d){

      doc.setDrawColor(...ORANGE); doc.setLineWidth(0.5); doc.line(M, y+1.8, M+14, y+1.8);

    };

    // table: head [str], widths [mm], align ['l'|'r'|'c'], rows [[cell]], cell = str | [lines] | {bar:0..1}
    const table = (head, widths, align, rows)=>{

          x += widths[i];
        });
        doc.setDrawColor(...LINE); doc.setLineWidth(0.15); doc.line(M, y + rh - 4, M+CW, y + rh - 4);
        y += rh;
      });
      y += 4;
    };
    // KPIs
    const tiles = [
      [String(d.totalDone), 'Visitas realizadas'],
      [String(d.totalMeta), 'Meta (agendadas)'],
      [d.pct==null ? '-' : Math.round(d.pct*100) + '%', 'Cumprimento da meta'],
      [d.daysWithMeta ? fmtReportCount(Math.round(d.avgMeta*10)/10) : '-', 'Meta média por dia'],
    ];
    const tw = (CW - 3*4)/4;
    tiles.forEach((t,i)=>{
      const x = M + i*(tw+4);
      doc.setFillColor(...SOFT); doc.roundedRect(x, y-4, tw, 20, 2, 2, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(...NAVY); doc.text(pdfTxt(t[0]), x+tw/2, y+5.5, { align:'center' });
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(pdfTxt(t[1]), x+tw/2, y+12, { align:'center' });
    });
    y += 26;
    // por dia + meta
    section('Visitas por dia e meta', 'A meta de cada dia é o número de visitas agendadas nesse dia (Agenda).');
    let md = d.metaDays; let cut = '';
    if(md.length > 45){ md = md.slice(-45); cut = 'A mostrar os 45 dias mais recentes. O Excel inclui todos os dias.'; }
    if(!md.length) para('Ainda sem visitas nem agendas neste período.');
    else{
      if(cut) para(cut);
      const mx = Math.max(1, ...md.map(x=>Math.max(x.done, x.meta)));
      table(['Dia','Realizadas','Meta','Cumprimento',''], [34,20,16,24,60], ['l','r','r','r','l'],
        md.map(x=>[shortDayLabel(x.date), String(x.done), x.meta ? String(x.meta) : '-', x.meta ? Math.round(x.done/x.meta*100)+'%' : '-', { bar: x.done/mx }]));
    }
    if(!d.single){
      section('Meta vs. realizadas por vendedor');
      if(!d.metaVendors.length) para('Ainda sem agendas nem visitas neste período.');
      else table(['Vendedor','Realizadas','Meta','Cumprimento'], [70,26,26,30], ['l','r','r','r'],
        d.metaVendors.map(x=>[x.name, String(x.done), x.meta ? String(x.meta) : '-', x.meta ? Math.round(x.done/x.meta*100)+'%' : '-']));
    }
    const listTable = (title, arr, unitTxt)=>{
      section(title);
      if(!arr.length){ para('Ainda sem visitas neste período.'); return; }
      const t = arr.reduce((a,b)=>a+b.count,0), mx = Math.max(...arr.map(x=>x.count));
      table([title.replace('Visitas por ','').replace(/^./,c=>c.toUpperCase()), unitTxt, '%', ''], [66,22,16,60], ['l','r','r','l'],
        arr.map(x=>[x.name, String(x.count), t ? Math.round(x.count/t*100)+'%' : '', { bar: x.count/mx }]));
    };
    if(!d.single) listTable('Visitas por vendedor', d.byVendor, 'Visitas');
    listTable('Visitas por canal', d.byChannel, 'Visitas');
    listTable('Visitas por tipo de estabelecimento', d.byType, 'Visitas');
    section('Taxa de conversão em vendas', 'Visitas com resultado "Venda realizada" ÷ visitas' + (state.mgrConvExcl ? ' (sem visitas com cliente ausente)' : '') + ' | ' + d.convFilter + '. Taxa: ' + (d.conv.base ? Math.round(d.conv.sales/d.conv.base*100) + '% (' + d.conv.sales + ' de ' + d.conv.base + ' visitas)' : '-') + '.');
    if(!d.conv.base) para('Ainda sem visitas neste período.');
    else{
      const convTable = (label, arr)=> table([label,'Vendas','Visitas','Taxa',''], [58,18,18,16,48], ['l','r','r','r','l'], arr.map(r=>[r.name, String(r.sales), String(r.base), r.pct + '%', { bar: r.pct/100 }]));
      if(!d.single && !d.convSc.vendor) convTable('Vendedor', d.conv.vendor);
      if(!d.convSc.canal) convTable('Canal', d.conv.canal);
      convTable('Tipo de estabelecimento', d.conv.tipo);
    }
    section('Produtos encomendados (vendas)');
    if(!d.products.length) para('Ainda sem encomendas neste período.');
    else{
      const mx = Math.max(...d.products.map(p=>p.qty)) || 1;
      table(['Produto','Unidade','Quantidade',''], [66,24,26,48], ['l','l','r','l'],
        d.products.map(p=>[p.product, p.unit, fmtReportCount(p.qty), { bar: p.qty/mx }]));
    }
    section('Distribuição numérica por produto', d.ndFilter + ' | ' + d.nd.clients + ' cliente(s) com verificação de prateleira. % dos clientes onde o produto estava em stock (última verificação de cada cliente).');
    if(!d.nd.rows.length) para('Ainda sem verificações de prateleira neste período.');
    else{
      table(['Produto','Categoria','Em stock','%',''], [58,32,26,14,40], ['l','l','r','r','l'],
        d.nd.rows.map(r=>[r.name, r.category, r.present + ' de ' + r.base, r.pct + '%', { bar: r.pct/100 }]));
      if(d.nd.noData.length) para('Sem verificações: ' + d.nd.noData.map(r=>r.name).join(', ') + '.');
    }
    // concorrência
    section('Concorrência no cliente - preço médio', d.compFilter + ' | ' + d.agg.visits.length + ' visita(s): ' + d.agg.withData.length + ' com concorrência registada, ' + d.agg.none + ' sem concorrentes' + (d.agg.noRecord>0 ? ', ' + d.agg.noRecord + ' sem registo' : '') + '. Preços em MT; unidade e caixa são calculadas à parte.');
    if(!d.agg.list.length) para('Sem registos de concorrência para este filtro.');
    d.agg.list.forEach(g=>{
      ensure(26);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(pdfTxt(g.name), M, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(pdfTxt('presente em ' + g.visits + ' visita(s)'), M+CW, y, { align:'right' });
      y += 5.5;
      const cell = arr=>{ const st = priceStat(arr); if(!st) return '-'; const l = [fmt2(st.avg) + ' MT']; l.push(st.n>1 ? (st.min!==st.max ? fmt2(st.min) + '-' + fmt2(st.max) + ' | ' : '') + st.n + ' registos' : '1 registo'); return l; };
      table(['Produto','Preço médio unidade','Preço médio caixa'], [64,50,50], ['l','r','r'],
        Object.values(g.prods).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name)).map(pr=>[
          pr.other.length ? [pr.name, pr.cat, '+ ' + pr.other.length + ' registo(s) sem indicar un./cx. (média ' + fmt2(priceStat(pr.other).avg) + ' MT)'] : [pr.name, pr.cat],
          cell(pr.unit), cell(pr.box)
        ]));
    });
    // rodapé
    const n = doc.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i); doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M, H-11, W-M, H-11);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
      doc.text(pdfTxt(APP_NAME_FULL + '  |  Gerado em ' + d.generated.toLocaleString('pt-PT', { dateStyle:'short', timeStyle:'short' })), M, H-6.5);
      doc.text('Página ' + i + ' de ' + n, W-M, H-6.5, { align:'right' });
    }
    return doc.output('blob');
  }

  function viewManagerReport(){
    const period = state.mgrReportPeriod || 'all';
    const reportVendor = state.mgrReportVendor || '';
    const visits = reportFilterVisits(period, state.mgrReportCustomStart, state.mgrReportCustomEnd)
      .filter(v=> !reportVendor || v.vendorId===reportVendor);
    const range = reportDateRange(period, state.mgrReportCustomStart, state.mgrReportCustomEnd);
    let dEnd = range.end || todayDateStr();
    let dStart = range.start || (visits.length ? visits.map(v=>localDateStr(v.timestamp)).sort()[0] : dEnd);
    if(dStart > dEnd) dStart = dEnd;
    let dayNote = '';
    if(dateSpan(dStart, dEnd).length > 31){ dStart = dateAdd(dEnd, -30); dayNote = 'A mostrar os últimos 31 dias do período.'; }
    const dayRows = dailyColumnRows(visits, dStart, dEnd, !reportVendor);

    const byVendor = {};
    visits.forEach(v=>{ byVendor[v.vendorId] = (byVendor[v.vendorId]||0) + 1; });
    const vendorRows = Object.entries(byVendor)
      .map(([id,count])=>({ name: vendorById(id)?.name || 'Vendedor removido', count }))
      .sort((a,b)=>b.count-a.count);

    const byChannel = {};
    const byType = {};
    visits.forEach(v=>{
      const c = clientById(v.clientId);
      const channelKey = (c && c.channel) ? c.channel : '—';
      byChannel[channelKey] = (byChannel[channelKey]||0) + 1;
      const typeKey = (c && c.establishmentType) ? c.establishmentType : 'Não definido';
      byType[typeKey] = (byType[typeKey]||0) + 1;
    });
    const channelRows = Object.entries(byChannel)
      .map(([k,count])=>({ name: CHANNEL_META[k] ? CHANNEL_META[k].label : 'Sem canal definido', count }))
      .sort((a,b)=>b.count-a.count);
    const typeRows = Object.entries(byType)
      .map(([k,count])=>({ name:k, count }))
      .sort((a,b)=>b.count-a.count);

    const byProduct = {};
    const prodOrder = [];
    visits.forEach(v=>{
      (v.orderItems||[]).forEach(o=>{
        const qty = parseFloat(o.quantity) || 0;
        const unit = o.unit === 'unidades' ? 'unidades' : 'caixas';
        const key = o.product + '|' + unit;
        if(!(key in byProduct)) prodOrder.push(key);
        byProduct[key] = (byProduct[key]||0) + qty;
      });
    });
    const productRows = prodOrder
      .map(key=>{ const [product, unit] = key.split('|'); return { name:`${product} (${unit})`, count: byProduct[key] }; })
      .sort((a,b)=>b.count-a.count);

    return `
      <div class="stack">
        <div class="row-wrap" style="justify-content:space-between; align-items:center;">
          <h2>Relatório</h2>
          <button class="btn btn-secondary btn-sm" onclick="App.mgrToggleReportExport()" aria-expanded="${state.mgrReportExportOpen?'true':'false'}" aria-label="Exportar relatório">${icon('download')} Exportar</button>
        </div>
        ${state.mgrReportExportOpen ? `
        <div class="card stack" style="gap:10px;">
          <div class="hint" style="margin:0;">Exporta o relatório com os filtros atuais (vendedor, período e, na concorrência, canal e tipo de estabelecimento).</div>
          <div class="row-wrap" style="gap:8px;">
            <button class="btn btn-primary btn-sm" ${state.mgrReportExporting?'disabled':''} onclick="App.exportReport('pdf')">${icon('download')} PDF</button>
            <button class="btn btn-primary btn-sm" ${state.mgrReportExporting?'disabled':''} onclick="App.exportReport('xlsx')">${icon('download')} Excel (.xlsx)</button>
          </div>
        </div>` : ''}
        <p class="hint">Meta de visitas diária, visitas por vendedor, canal e tipo de estabelecimento, e vendas (encomendas) por produto.</p>
        <div class="card">
          <div class="field" style="margin-bottom:10px;">
            <label for="mgrReportVendedor">Vendedor</label>
            <select id="mgrReportVendedor" onchange="App.mgrChangeReportVendor(this.value)">
              <option value="">Todos os vendedores</option>
              ${state.data.vendors.map(v=>`<option value="${esc(v.id)}" ${reportVendor===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="mgrReportPeriodo">Período</label>
            <select id="mgrReportPeriodo" onchange="App.mgrChangeReportPeriod(this.value)">
              <option value="all" ${period==='all'?'selected':''}>Todo o período</option>
              <option value="today" ${period==='today'?'selected':''}>Hoje</option>
              <option value="7d" ${period==='7d'?'selected':''}>Últimos 7 dias</option>
              <option value="30d" ${period==='30d'?'selected':''}>Últimos 30 dias</option>
              <option value="custom" ${period==='custom'?'selected':''}>Dias específicos…</option>
            </select>
          </div>
          ${period==='custom' ? `
          <div class="report-period-custom">
            <div class="field">
              <label for="mgrReportStart">De</label>
              <input type="date" id="mgrReportStart" value="${esc(state.mgrReportCustomStart||'')}" onchange="App.mgrChangeReportCustomDate('start', this.value)" />
            </div>
            <div class="field">
              <label for="mgrReportEnd">Até</label>
              <input type="date" id="mgrReportEnd" value="${esc(state.mgrReportCustomEnd||'')}" onchange="App.mgrChangeReportCustomDate('end', this.value)" />
            </div>
          </div>
          ` : ''}
        </div>
        <p class="hint">${visits.length} visita(s) no período selecionado${reportVendor ? ' · ' + esc(vendorById(reportVendor)?.name || 'vendedor') : ''}.</p>
        ${reportMetaSectionHtml(visits, reportVendor)}
        ${columnChartHtml(reportVendor ? 'Visitas por dia' : 'Visitas por dia, por vendedor', dayRows, 'Ainda sem visitas neste período.', { note: dayNote, legend: reportVendor ? null : vendorLegendFor(dayRows) })}
        ${reportVendor ? '' : reportBarListHtml('Visitas por vendedor', vendorRows, 'Ainda sem visitas neste período.', { share:true, unit:'visitas' })}
        ${reportBarListHtml('Visitas por canal', channelRows, 'Ainda sem visitas neste período.', { share:true, unit:'visitas' })}
        ${reportBarListHtml('Visitas por tipo de estabelecimento', typeRows, 'Ainda sem visitas neste período.', { share:true, unit:'visitas' })}
        ${reportConvHtml(visits)}
        ${reportBarListHtml('Produtos encomendados (vendas)', productRows, 'Ainda sem encomendas neste período.')}
        ${reportNdHtml(visits)}
        ${reportCompetitionHtml(visits)}
      </div>
    `;
  }

    mgrForgot(){ state.loginStep='managerRecover'; state.mgrRecError=null; state.recKeyDraft=''; render(); },
    async submitManagerRecovery(){
      const a = state.data.managerAuth || {};
      const raw = document.getElementById('recKey')?.value || '';
      const key = normRecoveryKey(raw);
      const np = document.getElementById('recNew')?.value || '', cf = document.getElementById('recConfirm')?.value || '';
      state.recKeyDraft = raw;
      if(!a.recoveryKeyHash){ state.mgrRecError = 'Ainda não existe chave de recuperação.'; render(); return; }
      if(recoveryLock()){ render(); return; }
      if(key.length !== 16){ state.mgrRecError = 'Escreva a chave completa (16 letras e números).'; render(); return; }
      if(np.length < 4){ state.mgrRecError = 'A nova password deve ter pelo menos 4 caracteres.'; render(); return; }
      if(np !== cf){ state.mgrRecError = 'As passwords não coincidem.'; render(); return; }
      const h = await hashPassword(key, RECOVERY_SALT);
      if(h !== a.recoveryKeyHash){ recoveryFail(); state.mgrRecError = 'Chave de recuperação incorreta.'; render(); return; }
      try{ localStorage.removeItem(RECOVERY_FAIL_KEY); }catch(e){}
      await saveManagerAuth({ passwordHash: await hashPassword(np, 'gestor-visitas-em-campo'), recoveryKeyHash:null, recoveryKeyAt:null, updatedAt: nowIso(), resetByKeyAt: nowIso() });
      state.mgrRecError = null; state.recKeyDraft = '';
      App.enterManager();
      showToast('Password redefinida. Gere uma nova chave de recuperação em Vendedores → Segurança do gestor.');
    },
    async mgrGenRecoveryKey(){
      const key = genRecoveryKey();
      await saveManagerAuth({ recoveryKeyHash: await hashPassword(normRecoveryKey(key), RECOVERY_SALT), recoveryKeyAt: nowIso() });
      state.mgrRecoveryKeyShown = key; renderView();
    },
    mgrHideRecoveryKey(){ state.mgrRecoveryKeyShown = ''; renderView(); },
    async mgrCopyRecoveryKey(){

        const sheets = await readXlsxSheets(await file.arrayBuffer());
        const pref = sheets.slice().sort((a,b)=> (normKey(b.name)==='calendario') - (normKey(a.name)==='calendario'));

        state.routeImport = { fileName:file.name, rows:res.rows, bad:res.bad, sheet:res.sheet, align:'empty', busy:false };
        renderView();
      }catch(e){
        showToast(e && e.message==='nodecomp' ? 'Este navegador não lê .xlsx.' : 'Não foi possível ler o ficheiro. Confirme que é .xlsx.');
      }

    async routeConfirm(){
      const ri = state.routeImport; if(!ri || ri.busy) return;
      ri.busy = true; renderView();
      try{
        const pv = routePreview(ri.rows, ri.align);
        await saveRoutes({ fileName: ri.fileName, importedAt: nowIso(), rows: ri.rows });
        let moved = 0;

    async planApplyAdjust(){
      const plan = planOf(state.planVendorId, state.planMonth || monthNow()); if(!plan || state.planBusy) return;
      const adj = planAdjustment(plan);
      state.planBusy = true; renderView();
      try{
        const days = Object.fromEntries(Object.entries(plan.days).map(([d,l])=>[d, l.slice()]));
        const carried = (plan.carried||[]).slice(), unsched = (plan.unscheduled||[]).slice();
        adj.moves.forEach(m=>{ carried.push(...m.keys); if(m.to) days[m.to] = planOrderIds(plan, [...(days[m.to]||[]), m.cid]); });
        adj.removes.forEach(r=>{ days[r.date] = (days[r.date]||[]).filter(x=>x!==r.cid); });
        adj.adds.forEach(a=>{ days[a.to] = planOrderIds(plan, [...(days[a.to]||[]), a.cid]); });
        adj.unplaced.forEach(u=>{ carried.push(...u.keys); if(!unsched.includes(u.cid)) unsched.push(u.cid); });
        const saved = await savePlan({ ...plan, days, carried, unscheduled: unsched, portfolio: portfolioOf(plan.vendorId).map(c=>c.id), status:'confirmed', confirmedAt: nowIso() });
        const n = await writePlanAgendas(saved);

    async mcImportPick(input){
      const file = input && input.files && input.files[0];
      if(!file) return;
      try{
        if(file.size > 15*1024*1024){ showToast('Ficheiro demasiado grande (máx. 15 MB).'); input.value=''; return; }
        const isCsv = /\.csv$/i.test(file.name) || /csv|text\/plain/.test(file.type||'');
        const sheets = isCsv ? parseCsv(await file.text()) : await readXlsxSheets(await file.arrayBuffer());
        const pref = sheets.slice().sort((a,b)=> (normKey(b.name)==='clientes') - (normKey(a.name)==='clientes'));
        let hdr = null, sheet = null;
        for(const sh of pref){ const h = detectClientHeader(sh.rows); if(h){ hdr = h; sheet = sh; break; } }
        if(!hdr){ showToast('Não encontrei a coluna "Nome" no ficheiro. Descarregue o modelo.'); input.value=''; return; }
        const parsed = parseClientRows(sheet.rows, hdr);
        if(!parsed.length){ showToast('O ficheiro não tem linhas de clientes.'); input.value=''; return; }
        if(parsed.length > 2000){ showToast('Máximo de 2000 clientes por importação.'); input.value=''; return; }
        state.mcImport = { fileName:file.name, parsed, mode:'update', ignoredCols:hdr.ignored, busy:false, progress:'' };
        renderView(); window.scrollTo(0,0);
      }catch(e){
        showToast(e && e.message==='nodecomp' ? 'Este navegador não lê .xlsx; guarde o ficheiro como .csv e tente de novo.' : 'Não foi possível ler o ficheiro. Confirme que é .xlsx ou .csv.');

    mcImportCancel(){ state.mcImport = null; renderView(); },
    async mcImportConfirm(){
      const im = state.mcImport; if(!im || im.busy) return;
      const plan = planClientImport(im.parsed, im.mode).filter(r=>r.action==='new' || r.action==='update');
      if(!plan.length) return;
      im.busy = true; renderView();
      let added = 0, updated = 0, failed = 0;
      for(let i=0;i<plan.length;i++){
        const r = plan[i];
        try{
          if(r.action==='new'){ await addClient({ ...r.data }); added++; }
          else{
            const m = r.match;
            const data = { name:m.name, address:m.address, neighborhood:m.neighborhood, city:m.city, contactName:m.contactName, phone:m.phone, email:m.email, nuit:m.nuit, channel:m.channel, establishmentType:m.establishmentType, visitFrequency:m.visitFrequency, vendorId:m.vendorId||'', lat:m.lat ?? null, lng:m.lng ?? null, ...r.patch };
            if('clientNumber' in r.patch) data.clientNumber = r.patch.clientNumber;
            await updateClient(m.id, data); updated++;
          }
        }catch(e){ failed++; }
        if(i % 10 === 9){ im.progress = `A importar… ${i+1}/${plan.length}`; renderView(); }
      }
      state.mcImport = null;
      showToast(`Importação concluída: ${added} novo(s), ${updated} atualizado(s)${failed ? `, ${failed} falharam` : ''}.`);
      renderView();
    },

      const productChecks = pcRes.items;

        product: row.querySelector('.nv-order-name').value.trim(),
        quantity: row.querySelector('.nv-order-qty').value.trim(),
        unit: row.querySelector('.nv-order-unit').value,

      const gps = state.nv.gps;

        timestamp: nowIso(),
        status: state.nv.status,
        notes,
        productChecks,
        orderItems,

        competition: comp.competition,
        noCompetition: comp.noCompetition,
        gps: gps ? { lat:gps.lat, lng:gps.lng, accuracy:gps.accuracy } : null,
        distanceMeters,
      });
      showToast('Visita registada.');
      state.nv = { clientId:null, gps:null, gpsStatus:null, gpsErr:null, status:null, newClientOpen:false, newClientGps:null, newClientGpsStatus:null };
