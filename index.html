<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
<title>Visitas em Campo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --surface-2:#EAEEF1;
    --ink:#16233C;
    --ink-muted:#57657A;
    --ink-faint:#8B96A6;
    --border:#DCE2E7;
    --accent:#CB623E;
    --accent-ink:#92492E;
    --accent-contrast:#FFFFFF;
    --accent-soft:#FAEEE9;
    --brand-navy:#292876;
    --brand-navy-ink:#FFFFFF;
    --brand-navy-ink-muted:rgba(255,255,255,0.72);
    --topbar-bg:var(--brand-navy);
    --topbar-border:rgba(255,255,255,0.14);
    --status-good-bg:#E3F3E9; --status-good-fg:#1E7A46;
    --status-warn-bg:#FCEFD9; --status-warn-fg:#9A5B0A;
    --status-bad-bg:#FBEAE7;  --status-bad-fg:#A3402A;
    --status-neutral-bg:#EDEFF2; --status-neutral-fg:#5B6472;
    --shadow: 0 1px 2px rgba(22,35,60,0.06), 0 1px 0 rgba(22,35,60,0.04);
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#6250d6; --cat-other:#8B96A6;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1520;
      --surface:#171F2B;
      --surface-2:#1E2833;
      --ink:#E8ECF2;
      --ink-muted:#98A5B7;
      --ink-faint:#6B7688;
      --border:#2B3646;
      --accent:#F3754A;
      --accent-ink:#FF8956;
      --accent-contrast:#1B1206;
      --accent-soft:#3A2015;
      --status-good-bg:#123324; --status-good-fg:#63D69A;
      --status-warn-bg:#3A2A0C; --status-warn-fg:#F0B559;
      --status-bad-bg:#3A1C16;  --status-bad-fg:#F49780;
      --status-neutral-bg:#232C38; --status-neutral-fg:#AEB8C4;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-other:#6B7688;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1520;
    --surface:#171F2B;
    --surface-2:#1E2833;
    --ink:#E8ECF2;
    --ink-muted:#98A5B7;
    --ink-faint:#6B7688;
    --border:#2B3646;
    --accent:#F3754A;
    --accent-ink:#FF8956;
    --accent-contrast:#1B1206;
    --accent-soft:#3A2015;
    --status-good-bg:#123324; --status-good-fg:#63D69A;
    --status-warn-bg:#3A2A0C; --status-warn-fg:#F0B559;
    --status-bad-bg:#3A1C16;  --status-bad-fg:#F49780;
    --status-neutral-bg:#232C38; --status-neutral-fg:#AEB8C4;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-other:#6B7688;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
  }
  h1,h2,h3{ font-weight:600; text-wrap:balance; margin:0; }
  p{ margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-variant-numeric:tabular-nums; }
  a{ color:var(--accent-ink); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  /* ---------- layout shells ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:12px 16px;
    background:var(--topbar-bg); color:var(--brand-navy-ink); border-bottom:1px solid var(--topbar-border);
    box-shadow:var(--shadow);
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{
    width:30px; height:30px; flex:none; border-radius:7px; background:#fff; padding:3px;
    box-shadow:0 1px 2px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:3px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:.01em; color:var(--brand-navy-ink); }
  .brand-sub{ font-size:11.5px; color:var(--brand-navy-ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .userchip{ display:flex; align-items:center; gap:8px; flex:none; }
  .userchip-name{ font-size:13px; font-weight:600; text-align:right; color:var(--brand-navy-ink); }
  .userchip-role{ font-size:11px; color:var(--brand-navy-ink-muted); text-align:right; }
  .switch-btn{
    border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); color:var(--brand-navy-ink);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .switch-btn:hover{ background:rgba(255,255,255,0.18); }

  .shell{ max-width:900px; margin:0 auto; padding:18px 16px 24px; overflow-x:clip; }

  .nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    box-shadow:0 -1px 2px rgba(22,35,60,0.06);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 8px; background:none; border:none; color:var(--ink-faint);
    font-size:11px; cursor:pointer;
  }
  .nav{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .nav::-webkit-scrollbar{ display:none; }
  .nav-btn{ min-width:64px; }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active svg{ color:var(--accent); }

  @media (min-width:860px){
    body{ padding-bottom:0; }
    .layout{ display:flex; max-width:1100px; margin:0 auto; align-items:flex-start; }
    .nav{
      position:sticky; top:57px; left:auto; right:auto;
      flex-direction:column; width:196px; flex:none;
      border-top:none; border-right:1px solid var(--border);
      box-shadow:none; padding:16px 10px; gap:2px;
      height:calc(100vh - 57px);
    }
    .nav{ overflow-x:visible; }
    .nav-btn{ min-width:0; flex:none; flex-direction:row; justify-content:flex-start; gap:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; }
    .nav-btn.active{ background:var(--accent-soft); }
    .shell{ flex:1; min-width:0; }
  }

  /* ---------- primitives ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
  .section-title{ font-size:13px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=password],
  input[type=search], input[type=tel], input[type=email], select, textarea{
    font-family:inherit; font-size:14.5px; padding:9px 11px;
    border:1px solid var(--border); border-radius:8px; background:var(--surface);
    color:var(--ink); width:100%;
  }
  input[type=date], input[type=datetime-local]{ color-scheme:light; }
  :root:not([data-theme="light"]) input[type=date], :root:not([data-theme="light"]) input[type=datetime-local]{ color-scheme:dark; }
  :root[data-theme="dark"] input[type=date], :root[data-theme="dark"] input[type=datetime-local]{ color-scheme:dark; }
  .field textarea{ resize:vertical; min-height:72px; }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .hint{ font-size:12px; color:var(--ink-faint); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;
    border:1px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .btn svg{ width:16px; height:16px; flex:none; }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:var(--surface); border-color:var(--border); color:var(--ink); }
  .btn-secondary:hover{ background:var(--surface-2); }
  .btn-ghost{ background:none; border:none; color:var(--accent-ink); padding:8px 4px; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }

  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:4px 9px; border-radius:99px; white-space:nowrap;
  }
  .status-good{ background:var(--status-good-bg); color:var(--status-good-fg); }
  .status-warn{ background:var(--status-warn-bg); color:var(--status-warn-fg); }
  .status-bad{ background:var(--status-bad-bg); color:var(--status-bad-fg); }
  .status-neutral{ background:var(--status-neutral-bg); color:var(--status-neutral-fg); }

  .statgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:560px){ .statgrid{ grid-template-columns:repeat(4,1fr); } }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; }
  .stat-num{ font-family:'IBM Plex Mono'; font-size:24px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:12px; color:var(--ink-muted); margin-top:3px; }

  .barlist{ display:flex; flex-direction:column; gap:9px; }
  .bar-row{ display:grid; grid-template-columns:104px 1fr 44px; align-items:center; gap:10px; }
  .bar-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:99px; }
  .bar-count{ font-family:'IBM Plex Mono'; font-size:13px; text-align:right; font-variant-numeric:tabular-nums; }
  .chart-plot{ display:flex; flex-direction:column; gap:4px; position:relative; }
  .hgrid{ position:absolute; top:0; bottom:0; left:128px; right:0; pointer-events:none; }
  .hgrid i{ position:absolute; top:0; bottom:0; width:1px; background:var(--border); opacity:.8; }
  .haxis{ position:relative; height:16px; margin-left:128px; margin-top:2px; }
  .haxis span{ position:absolute; top:2px; transform:translateX(-50%); font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; }
  .haxis span:first-child{ transform:none; }
  .haxis-title{ margin-left:128px; font-size:11px; color:var(--ink-faint); }
  .colchart{ display:grid; grid-template-columns:30px minmax(0,1fr); column-gap:6px; }
  .col-plot, .col-xaxis{ min-width:0; }
  .col-yaxis{ position:relative; height:var(--h,150px); }
  .col-yaxis span{ position:absolute; right:0; transform:translateY(50%); font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; line-height:1; }
  .col-plot{ position:relative; height:var(--h,150px); border-bottom:1px solid var(--ink-faint); }
  .col-grid{ position:absolute; left:0; right:0; height:0; border-top:1px solid var(--border); opacity:.9; pointer-events:none; }
  .col-cols{ position:absolute; inset:0; display:flex; gap:3px; }
  .col{ position:relative; flex:1; min-width:0; outline:none; }
  .col-bar{ position:absolute; bottom:0; left:50%; width:min(100%,26px); transform:translateX(-50%); background:var(--accent); border-radius:4px 4px 0 0; transition:filter .15s ease; }
  .col:hover .col-bar, .col:focus-visible .col-bar{ filter:brightness(1.12); }
  .col:focus-visible{ box-shadow:0 0 0 2px var(--accent) inset; border-radius:4px; }
  .col-val{ position:absolute; left:50%; transform:translateX(-50%); font-size:11px; font-family:'IBM Plex Mono'; color:var(--ink-muted); font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap; }
  .nolabels .col-val{ display:none; }
  .col .chart-tip{ top:auto; left:50%; transform:translate(-50%,2px); }
  .col:hover .chart-tip, .col:focus-visible .chart-tip{ opacity:1; transform:translate(-50%,0); }
  .col .chart-tip{ white-space:normal; width:max-content; max-width:190px; line-height:1.35; text-align:left; }
  .col-left .chart-tip{ left:0; transform:translate(0,2px); }
  .col-left:hover .chart-tip, .col-left:focus-visible .chart-tip{ transform:translate(0,0); }
  .col-right .chart-tip{ left:auto; right:0; transform:translate(0,2px); }
  .col-right:hover .chart-tip, .col-right:focus-visible .chart-tip{ transform:translate(0,0); }
  .col-bar.stacked{ display:flex; flex-direction:column-reverse; overflow:hidden; background:none; }
  .col-seg{ flex-grow:1; flex-shrink:1; flex-basis:0; min-height:3px; border-top:2px solid var(--surface); box-sizing:border-box; }
  .col-seg:first-child{ border-top:none; }
  .legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  details.chart-table summary{ cursor:pointer; font-size:12px; color:var(--ink-muted); margin-top:10px; }
  details.chart-table table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  details.chart-table th, details.chart-table td{ text-align:right; padding:4px 6px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  details.chart-table th:first-child, details.chart-table td:first-child{ text-align:left; }
  details.chart-table th{ color:var(--ink-muted); font-weight:600; }
  .table-scroll{ overflow-x:auto; }
  .col-xaxis{ display:grid; grid-template-columns:30px 1fr; column-gap:6px; margin-top:5px; }
  .col-xl-row{ display:flex; gap:3px; }
  .col-xl{ flex:1; min-width:0; text-align:center; font-size:10.5px; line-height:1.15; color:var(--ink-faint); font-family:'IBM Plex Mono'; white-space:nowrap; }
  .col-xl small{ display:block; font-size:9px; opacity:.85; }
  .chart-row{ display:grid; grid-template-columns:118px 1fr; align-items:center; gap:10px; }
  .chart-label{ font-size:12.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chart-track{ position:relative; height:24px; border-left:1px solid var(--border); border-radius:0 0 0 0; outline:none; }
  .chart-track:focus-visible{ box-shadow:0 0 0 2px var(--accent) inset; border-radius:4px; }
  .chart-fill{ position:absolute; left:0; top:2px; bottom:2px; background:var(--accent); border-radius:0 4px 4px 0; min-width:4px; transition:width .25s ease, filter .15s ease; }
  .chart-track:hover .chart-fill, .chart-track:focus-visible .chart-fill{ filter:brightness(1.12); }
  .chart-val{ position:absolute; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chart-val-inside{ right:7px; color:#fff; mix-blend-mode:normal; }
  .chart-tip{
    position:absolute; left:0; top:-30px; background:var(--ink); color:var(--bg);
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:7px; white-space:nowrap;
    opacity:0; pointer-events:none; transform:translateY(2px); transition:opacity .12s ease, transform .12s ease; z-index:5;
  }
  .chart-track:hover .chart-tip, .chart-track:focus-visible .chart-tip{ opacity:1; transform:translateY(0); }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink-muted); margin:0 0 8px; align-items:center; }
  .chart-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .lg-bar{ width:12px; height:10px; border-radius:2px; background:var(--accent); display:inline-block; }
  .lg-tick{ width:2px; height:14px; border-radius:1px; background:var(--ink); display:inline-block; }
  .bullet-tick{ position:absolute; top:-1px; bottom:-1px; width:2px; margin-left:-1px; background:var(--ink); border-radius:1px; pointer-events:none; }
  .report-period-custom{ border-top:1px solid var(--border); margin-top:10px; padding-top:10px; display:flex; gap:10px; flex-wrap:wrap; }
  .report-period-custom .field{ flex:1; min-width:130px; }

  .visit-card{ display:flex; gap:11px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
  .visit-stripe{ width:4px; flex:none; }
  .visit-stripe.status-good{ background:var(--status-good-fg); }
  .visit-stripe.status-warn{ background:var(--status-warn-fg); }
  .visit-stripe.status-bad{ background:var(--status-bad-fg); }
  .visit-stripe.status-neutral{ background:var(--status-neutral-fg); }
  .visit-body{ padding:12px 14px 12px 4px; flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .visit-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .visit-client{ font-size:14.5px; font-weight:700; }
  .visit-meta{ font-size:12px; color:var(--ink-muted); font-family:'IBM Plex Mono'; }
  .visit-notes{ font-size:13px; color:var(--ink); line-height:1.4; }
  .visit-notes svg{ width:14px; height:14px; vertical-align:-2px; flex:none; }
  .visit-footer{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

  .client-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow); }
  .client-name{ font-size:14.5px; font-weight:700; }
  .client-addr{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .client-recency{ font-size:11.5px; margin-top:5px; }

  .empty-state{ text-align:center; padding:34px 18px; color:var(--ink-muted); border:1px dashed var(--border); border-radius:var(--radius); }
  .empty-state svg{ width:30px; height:30px; color:var(--ink-faint); margin-bottom:8px; }
  .empty-state p{ font-size:13.5px; }

  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600;
    padding:10px 18px; border-radius:99px; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  :root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){ .toast{ } }
  @media (min-width:860px){ .toast{ bottom:24px; } }

  .login-wrap{ max-width:420px; margin:8vh auto 0; padding:0 18px; display:flex; flex-direction:column; gap:22px; }
  .login-hero{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .login-hero .brand-mark{ width:72px; height:72px; border-radius:16px; padding:7px; box-shadow:0 2px 8px rgba(22,35,60,0.14); }
  .login-hero .brand-mark img{ border-radius:9px; }
  .login-hero h1{ font-size:22px; }
  .login-hero p{ color:var(--ink-muted); font-size:13.5px; }
  .choice-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px; cursor:pointer; box-shadow:var(--shadow);
  }
  .choice-btn:hover{ border-color:var(--accent); }
  .choice-btn svg{ width:22px; height:22px; color:var(--accent); flex:none; }
  .choice-title{ font-size:14.5px; font-weight:700; }
  .choice-sub{ font-size:12px; color:var(--ink-muted); margin-top:1px; }
  .vendor-pick-list{ display:flex; flex-direction:column; gap:7px; max-height:260px; overflow-y:auto; }
  .vendor-pick-btn{
    text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .vendor-pick-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .divider{ display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:11.5px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--border); }

  .banner{ display:flex; align-items:center; gap:9px; font-size:12.5px; padding:9px 12px; border-radius:8px; background:var(--status-warn-bg); color:var(--status-warn-fg); font-weight:600; }
  .banner svg{ width:16px; height:16px; flex:none; }

  .product-row{ display:grid; grid-template-columns:minmax(0,1fr) 92px 30px; gap:7px; align-items:center; padding-bottom:10px; border-bottom:1px dashed var(--border); }
  .product-row .prod-prices{ grid-column:1 / 3; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .product-row .prod-prices label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-muted); }
  .product-row .comp-legacy{ grid-column:1 / 3; }
  .product-row.invalid select, .product-row.invalid .prod-prices input{ border-color:var(--status-bad-fg); }
  .product-row select{ padding:8px 6px; font-size:13px; }
  .product-row input{ padding:8px 8px; font-size:13px; }
  .order-row{ display:grid; grid-template-columns:1fr 64px 96px 30px; gap:7px; align-items:center; }
  .order-row select{ padding:8px 6px; font-size:13px; }
  .order-row input{ padding:8px 8px; font-size:13px; }
  .row-del{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:17px; line-height:1; padding:6px; }
  .row-del:hover{ color:var(--status-bad-fg); }
  .comp-row{ display:grid; grid-template-columns:minmax(0,1fr) 30px; gap:7px; align-items:center; padding-bottom:10px; border-bottom:1px dashed var(--border); }
  .comp-row select, .comp-row input{ padding:8px 6px; font-size:13px; min-width:0; }
  .comp-row .row-del{ grid-column:2; grid-row:1; }
  .comp-prices{ grid-column:1; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .comp-prices label{ display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-muted); }
  .comp-legacy{ grid-column:1; font-size:12px; color:var(--ink-faint); }
  .comp-row.invalid select, .comp-row.invalid .comp-prices input{ border-color:var(--status-bad-fg); }
  .comp-block{ padding:10px 0; border-top:1px solid var(--border); }
  .comp-block:first-of-type{ border-top:none; padding-top:2px; }
  .comp-head{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-weight:600; }
  .comp-head small{ font-weight:400; color:var(--ink-muted); font-size:12px; white-space:nowrap; }
  .comp-tbl{ display:grid; grid-template-columns:minmax(0,1fr) 86px 86px; column-gap:8px; row-gap:7px; align-items:start; margin-top:6px; font-size:13px; }
  .comp-tbl .th{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; text-align:right; }
  .comp-tbl .th:first-child{ text-align:left; }
  .comp-tbl .td-prod{ min-width:0; color:var(--ink); overflow-wrap:anywhere; }
  .comp-tbl .td-prod small{ display:block; color:var(--ink-muted); font-size:11px; }
  .comp-tbl .td-val{ text-align:right; font-weight:600; color:var(--ink); white-space:nowrap; }
  .comp-tbl .td-val small{ display:block; font-weight:400; color:var(--ink-muted); font-size:11px; }
  .comp-tbl .td-val.none{ color:var(--ink-faint); font-weight:400; }
  .check-row{ display:flex; gap:8px; align-items:center; font-size:13px; cursor:pointer; }
  .check-row input{ width:18px; height:18px; margin:0; accent-color:var(--accent); }

  .status-picker{ display:flex; flex-wrap:wrap; gap:8px; }
  .status-opt{
    border:1.5px solid var(--border); background:var(--surface); border-radius:99px; padding:8px 14px;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-muted);
  }
  .status-opt.picked.status-good{ border-color:var(--status-good-fg); background:var(--status-good-bg); color:var(--status-good-fg); }
  .status-opt.picked.status-warn{ border-color:var(--status-warn-fg); background:var(--status-warn-bg); color:var(--status-warn-fg); }
  .status-opt.picked.status-bad{ border-color:var(--status-bad-fg); background:var(--status-bad-bg); color:var(--status-bad-fg); }
  .status-opt.picked.status-neutral{ border-color:var(--status-neutral-fg); background:var(--status-neutral-bg); color:var(--status-neutral-fg); }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; }
  .filters select, .filters input{
    font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--surface); color:var(--ink);
  }
  .filters input[type=search]{ flex:1; min-width:160px; }

  .pf-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .pf-chips::-webkit-scrollbar{ display:none; }
  .pf-chip{ flex:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:99px; padding:6px 13px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  .pf-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); font-weight:600; }
  .pf-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (min-width:560px){ .pf-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (min-width:860px){ .pf-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .pf-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .pf-img{ aspect-ratio:1/1; background:#fff; display:flex; align-items:center; justify-content:center; color:#8B96A6; border-bottom:1px solid var(--border); }
  .pf-img img{ width:100%; height:100%; object-fit:contain; display:block; }
  .pf-ph{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:#8B96A6; }
  .pf-ph svg{ width:34px; height:34px; }
  .pf-info{ padding:9px 11px 11px; }
  .pf-name{ font-size:13.5px; font-weight:700; line-height:1.25; }
  .pf-desc{ font-size:12px; color:var(--ink-muted); margin-top:3px; line-height:1.35; }
  .pf-thumb{ width:46px; height:46px; flex:none; border:1px solid var(--border); border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#8B96A6; }
  .pf-thumb img{ width:100%; height:100%; object-fit:contain; }
  .pf-thumb svg{ width:20px; height:20px; }
  .subtabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .subtab{ background:none; border:none; padding:9px 4px; font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subtab.active{ color:var(--ink); border-color:var(--accent); }
</style>

  function haversineMeters(lat1,lon1,lat2,lon2){
    const R=6371000, toRad=d=>d*Math.PI/180;
    const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
    const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function orderByProximity(clients, start){
    const withCoords = clients.filter(c=>c.lat!=null && c.lng!=null);
    const withoutCoords = clients.filter(c=>c.lat==null || c.lng==null);
    const remaining = withCoords.slice();
    const ordered = [];
    let current = start;
    if(!current && remaining.length){ current = { lat:remaining[0].lat, lng:remaining[0].lng }; }
    while(remaining.length){
      let bestIdx = 0, bestDist = Infinity;
      remaining.forEach((c,i)=>{
        const d = haversineMeters(current.lat, current.lng, c.lat, c.lng);
        if(d < bestDist){ bestDist = d; bestIdx = i; }
      });
      const next = remaining.splice(bestIdx,1)[0];
      ordered.push(next);
      current = { lat: next.lat, lng: next.lng };
    }
    return [...ordered, ...withoutCoords];
  }
  function computeLegs(list, start){
    let prev = start;
    return list.map(c=>{
      let legMeters = null;
      if(prev && c.lat!=null && c.lng!=null) legMeters = haversineMeters(prev.lat, prev.lng, c.lat, c.lng);
      if(c.lat!=null && c.lng!=null) prev = { lat:c.lat, lng:c.lng };
      return { ...c, legMeters };
    });
  }

  function productCategories(){ return (state.data && Array.isArray(state.data.categories) && state.data.categories.length) ? state.data.categories : DEFAULT_CATEGORIES; }

  function fbConfigured(){

    return !!(c && c.apiKey && c.projectId && !/COLE|SEU_|YOUR_|XXXX/i.test(String(c.apiKey) + String(c.projectId)));

  function fbReportError(e){

  }
  // Escritas: esperam pela confirmação do servidor até 1,5 s; sem rede, ficam em fila no aparelho e a app continua (não bloqueia o trabalho em campo)
  function fbWrite(fn){
    let p; try{ p = fn(); }catch(e){ return Promise.reject(e); }
    const pending = p.then(()=>undefined, e=>{ console.error('Firestore:', e); fbReportError(e); throw e; });
    pending.catch(()=>{});
    if(typeof navigator!=='undefined' && navigator.onLine===false) return Promise.resolve();
    return Promise.race([pending, new Promise(r=>setTimeout(r, 1500))]);
  }
  // sem rede, lê o que está guardado no aparelho em vez de falhar
  function fbGet(ref){ return ref.get().catch(e=>(e && e.code==='unavailable') ? ref.get({ source:'cache' }) : Promise.reject(e)); }
  function fbWrapListener(cb, errCb){ return [cb, e=>{ fbReportError(e); if(errCb) errCb(e); }]; }
  function fbQuery(q){
    return {
      where:(a,b,c)=>fbQuery(q.where(a,b,c)),
      orderBy:(a,b)=>fbQuery(q.orderBy(a,b)),
      limit:n=>fbQuery(q.limit(n)),
      get:()=>fbGet(q),
      onSnapshot:(cb, errCb)=>q.onSnapshot(...fbWrapListener(cb, errCb)),
      doc:id=>fbDoc(id===undefined ? q.doc() : q.doc(id)),
      add:async data=>{ const ref = q.doc(); await fbWrite(()=>ref.set(data)); return fbDoc(ref); },
    };
  }
  function fbDoc(d){
    return {
      id:d.id,
      get:()=>fbGet(d).catch(e=>(e && e.code==='unavailable') ? { exists:false, id:d.id, data:()=>undefined } : Promise.reject(e)),
      set:(x,o)=>fbWrite(()=>o ? d.set(x,o) : d.set(x)),
      update:x=>fbWrite(()=>d.update(x)),
      delete:()=>fbWrite(()=>d.delete()),
      onSnapshot:(cb, errCb)=>d.onSnapshot(...fbWrapListener(cb, errCb)),
    };
  }
  async function initFirebaseDb(){
    if(!fbConfigured()) return null;
    if(!window.firebase || !firebase.firestore || !firebase.auth) throw new Error('Não foi possível carregar o Firebase. Verifique a ligação à internet e tente de novo.');
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const fs = firebase.firestore();
    fs.settings({ ignoreUndefinedProperties:true, merge:true });
    try{ await fs.enablePersistence({ synchronizeTabs:true }); }catch(e){}
    const auth = firebase.auth();
    const user = await new Promise(res=>{ const un = auth.onAuthStateChanged(u=>{ un(); res(u); }); });
    if(!user){
      try{ await auth.signInAnonymously(); }
      catch(e){
        if(e && e.code==='auth/operation-not-allowed') throw new Error('Ative o início de sessão "Anónimo" em Firebase → Authentication → Sign-in method.');
        if(e && (e.code==='auth/network-request-failed')) throw new Error('Sem ligação à internet. Na primeira abertura é preciso estar online.');
        throw new Error('Não foi possível iniciar a ligação ao Firebase (' + ((e && e.code) || 'erro') + ').');
      }
    }
    return {
      collection:name=>fbQuery(fs.collection(name)),
      doc:path=>fbDoc(fs.doc(path)),
      flush:()=>Promise.race([fs.waitForPendingWrites(), new Promise(r=>setTimeout(r, 20000))]),
      isFirebase:true,
    };
  }
  async function initDb(){
    try{ db = await initFirebaseDb(); }
    catch(e){
      state.dbMode = 'error'; state.fatalMsg = (e && e.message) || 'Erro ao ligar à base de dados.';

    }
    if(!db){
      try{ db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }

  function subscribeAll(){
    db.collection('vendors').orderBy('name').onSnapshot(snap=>{
      state.data.vendors = snap.docs.map(d=>({ id:d.id, ...d.data() }));

    }, ()=>{});
    db.collection('plans').onSnapshot(snap=>{

    }, ()=>{});

      state.suppliersLoaded = true;

  function productImageKey(name){
    const n = String(name||'').trim().toLowerCase();
    let h = 5381; for(let i=0;i<n.length;i++){ h = ((h<<5)+h + n.charCodeAt(i)) >>> 0; }
    const slug = n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'produto';
    return 'pimg_' + slug + '_' + h.toString(36);
  }

  function resizeImageFile(file, max){
    max = max || 480;
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        try{
          const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * r)), h = Math.max(1, Math.round(img.naturalHeight * r));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          let q = 0.82, data = cv.toDataURL('image/jpeg', q);
          while(data.length > 190000 && q > 0.4){ q -= 0.1; data = cv.toDataURL('image/jpeg', q); }
          URL.revokeObjectURL(url);
          resolve(data);
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
      img.src = url;
    });
  }

  function parseOrdersEmails(text){
    const parts = String(text||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
    if(!parts.length) return { error:'Indique um email.' };
    const bad = parts.find(x=>!/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]{2,}$/.test(x));
    if(bad) return { error:`Email inválido: ${bad}` };
    const seen = new Set(), list = [];
    parts.forEach(x=>{ const k = x.toLowerCase(); if(!seen.has(k)){ seen.add(k); list.push(x); } });
    return { list };
  }

     A app não envia emails sozinha: com o gestor autenticado gera-se uma chave secreta, que fica guardada só como hash,
     e abre-se o email já escrito para o endereço de recuperação. Quem tiver acesso a esse email consegue redefinir a password. */
  const RECOVERY_EMAIL_DEFAULT = 'francisco.junior@primeroute-mz.com';
  const RECOVERY_SALT = 'gestor-recuperacao-visitas';
  const RECOVERY_FAIL_KEY = 'visitasEmCampo.recoveryFails';

  function maskEmail(e){ const [l,d] = String(e||'').split('@'); return (l ? l[0] : '') + '•••@' + (d||''); }
  function genRecoveryKey(){
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    const c = Array.from(b).map(x=>A[x % A.length]).join('');
    return c.match(/.{4}/g).join('-');
  }
  function normRecoveryKey(k){ return String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
  function recoveryLock(){
    try{ const f = JSON.parse(localStorage.getItem(RECOVERY_FAIL_KEY)||'null'); if(f && f.until && f.until > Date.now()) return Math.ceil((f.until-Date.now())/60000); }catch(e){}
    return 0;
  }
  function recoveryFail(){
    try{
      const f = JSON.parse(localStorage.getItem(RECOVERY_FAIL_KEY)||'null') || { n:0 };
      f.n = (f.n||0) + 1; if(f.n >= 5){ f.until = Date.now() + 15*60000; f.n = 0; }
      localStorage.setItem(RECOVERY_FAIL_KEY, JSON.stringify(f));

  }

    return `mailto:${recoveryEmail()}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  async function importAllData(obj, onProgress){
    const tasks = [];
    BACKUP_COLLECTIONS.forEach(c=>(obj.collections[c]||[]).forEach(it=>{ if(it && it.id && it.data) tasks.push({ kind:'c', c, id:String(it.id), data:it.data }); }));
    Object.keys(obj.docs||{}).forEach(path=>{ if(BACKUP_DOCS.includes(path)){
      let data = obj.docs[path];
      if(path==='settings/routes' && data && Array.isArray(data.rows)) data = routesToDoc(data);
      tasks.push({ kind:'d', path, data });
    } });
    let ok = 0, failed = 0;
    if(state.dbMode==='live'){
      for(let i=0;i<tasks.length;i+=20){
        await Promise.all(tasks.slice(i,i+20).map(async t=>{
          try{ if(t.kind==='c') await db.collection(t.c).doc(t.id).set(t.data); else await db.doc(t.path).set(t.data); ok++; }
          catch(e){ failed++; }
        }));
        if(onProgress) onProgress(Math.min(i+20, tasks.length), tasks.length);
      }
      if(db.flush) await db.flush();
    }else{
      const D = state.data;
      tasks.forEach(t=>{
        if(t.kind==='c'){
          if(t.c==='productImages'){ D.productImages = D.productImages || {}; D.productImages[t.id] = t.data.data; }
          else{ const arr = D[t.c] = D[t.c] || []; const i = arr.findIndex(x=>x.id===t.id); const row = { id:t.id, ...t.data }; if(i>=0) arr[i] = row; else arr.push(row); }
        }else{
          const d = t.data;
          if(t.path==='settings/products') D.products = normalizeProducts(d.items);
          else if(t.path==='settings/categories') D.categories = normalizeCategories(d.items);
          else if(t.path==='settings/competitors') D.competitorProducts = normalizeCompetitorProducts(d.items);
          else if(t.path==='settings/orders') D.ordersEmail = d.email || '';
          else if(t.path==='settings/managerAuth') D.managerAuth = d;
          else if(t.path==='settings/routes') D.routes = routesFromDoc(d);
        }
        ok++;
      });
      saveOfflineStore();
    }
    return { ok, failed };
  }

    const c = clientById(id);
    if(c) Object.assign(c, body);
    if(state.dbMode==='offline') saveOfflineStore();
    return true;
  }
  // aceita "-25.9653, 32.5892" (como o Google Maps copia), "-25,9653 32,5892" ou "-25.9653;32.5892"
  function parseLatLng(txt){
    const t = String(txt||'').replace(/[−–]/g,'-');
    const m = t.match(/-?\d+(?:[.,]\d+)?/g);
    if(!m || m.length!==2) return null;
    const lat = parseFloat(m[0].replace(',','.')), lng = parseFloat(m[1].replace(',','.'));
    if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180) return null;
    return { lat, lng };
  }
  // aviso (não bloqueia) quando as coordenadas ficam fora de Moçambique: costuma ser latitude e longitude trocadas
  function gpsOutsideMz(lat, lng){ return !(lat>=-27.5 && lat<=-9.5 && lng>=30 && lng<=41); }
  async function updateVisit(id, data){
    if(state.dbMode==='live'){

    }
    const v = state.data.visits.find(x=>x.id===id);

  /* ============ PLANO MENSAL AUTOMÁTICO (proposta do sistema, confirmada pelo gestor) ============ */
  // Bi-Mensal = duas vezes por mês (15 dias); sem frequência definida assume-se mensal
  const FREQ_DAYS = { semanal:7, bimensal:15, mensal:30, trimestral:90 };
  const WD_ABBR = ['dom','seg','ter','qua','qui','sex','sáb'];
  function planId(vendorId, month){ return vendorId + '_' + month; }
  function planOf(vendorId, month){ return (state.data.plans||[]).find(x=>x.id===planId(vendorId, month)) || null; }
  function monthNow(){ return todayDateStr().slice(0,7); }
  function monthLabel(m){ const [y,mm] = m.split('-'); const n = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; return `${n[(+mm)-1]} de ${y}`; }
  function dayLabelPlan(d){ const wd = new Date(d+'T12:00:00').getDay(); return `${WD_ABBR[wd]} ${fmtDateOnly(d).slice(0,5)}`; }
  function planWorkingDays(month, sat){
    const [y,m] = month.split('-').map(Number);
    const first = month + '-01', last = month + '-' + String(new Date(y, m, 0).getDate()).padStart(2,'0');
    const today = todayDateStr();
    const start = first > today ? first : today;
    if(start > last) return [];
    return dateSpan(start, last).filter(d=>{ const wd = new Date(d+'T12:00:00').getDay(); return (wd>=1 && wd<=5) || (sat && wd===6); });
  }
  // Limite de visitas por dia nas propostas: às segundas-feiras no máximo MONDAY_MAX (o dia é mais curto: reuniões, preparação da semana)
  const MONDAY_MAX = 6;
  function dayCap(date, perDay){
    const wd = new Date(date+'T12:00:00').getDay();
    return wd===1 ? Math.min(perDay, MONDAY_MAX) : perDay;
  }
  // Semana de trabalho = de segunda a domingo (chave = data da segunda-feira). Um cliente nunca é visitado duas vezes na mesma semana.
  function weekOf(date){
    const wd = new Date(date+'T12:00:00').getDay();
    return dateAdd(date, -(wd===0 ? 6 : wd-1));
  }
  function clientInWeek(days, date, cid, ignoreDate){
    const wk = weekOf(date);
    return Object.keys(days).some(d=> d!==ignoreDate && weekOf(d)===wk && (days[d]||[]).includes(cid));
  }
  // retira as repetições: em cada semana o cliente fica só no primeiro dia em que aparece
  function dedupeWeeks(days){
    const seen = {}; let removed = 0;
    Object.keys(days).sort().forEach(d=>{
      const wk = weekOf(d);
      days[d] = (days[d]||[]).filter(id=>{
        const k = wk+'|'+id;
        if(seen[k]){ removed++; return false; }
        seen[k] = 1; return true;
      });
    });
    return removed;
  }
  function portfolioOf(vendorId){ return state.data.clients.filter(c=>c.vendorId===vendorId); }
  function lastVisitDateOf(clientId){
    let best = '';
    state.data.visits.forEach(v=>{ if(v.clientId===clientId){ const d = localDateStr(v.timestamp); if(d>best) best = d; } });
    return best;
  }
  function minKmToDay(c, ids){
    if(c.lat==null || c.lng==null || !ids.length) return null;
    let best = null;
    ids.forEach(id=>{ const o = clientById(id); if(o && o.lat!=null){ const k = haversineMeters(c.lat, c.lng, o.lat, o.lng)/1000; if(best==null || k<best) best = k; } });
    return best;
  }
  function orderDayIds(ids){ return orderByProximity(ids.map(clientById).filter(Boolean)).map(c=>c.id); }
  // devolve { days:{data:[clientId]}, unscheduled:[clientId], noFreq:n, noCoords:n, capacityNeeded:n }
  function generatePlanDays(vendorId, month, perDay, sat){
    const days = planWorkingDays(month, sat);
    const out = { days:{}, unscheduled:[], noFreq:0, noCoords:0, total:0 };
    if(!days.length) return out;
    days.forEach(d=>{ out.days[d] = []; });
    const clients = portfolioOf(vendorId);
    const occ = [];
    const lastDay = days[days.length-1];
    clients.forEach(c=>{
      if(!FREQ_DAYS[c.visitFrequency]) out.noFreq++;
      if(c.lat==null || c.lng==null) out.noCoords++;
      const interval = FREQ_DAYS[c.visitFrequency] || 30;
      const last = lastVisitDateOf(c.id);
      let t = last ? dateAdd(last, interval) : days[0];
      const wait = last ? Math.round((new Date(days[0]+'T12:00:00') - new Date(last+'T12:00:00'))/86400000) : 9999;
      if(t < days[0]) t = days[0];
      let k = 0;
      while(t <= lastDay){ occ.push({ c, target:t, interval, wait: k===0 ? wait : 0 }); t = dateAdd(t, interval); k++; }
    });
    out.total = occ.length;
    occ.sort((a,b)=> a.target<b.target ? -1 : a.target>b.target ? 1 : b.wait-a.wait || a.c.name.localeCompare(b.c.name));
    const assigned = {}; // clientId -> [datas]
    const idxOf = t => { const i = days.findIndex(d=>d>=t); return i<0 ? days.length-1 : i; };
    occ.forEach(o=>{
      const start = idxOf(o.target);
      const slack = o.interval>=30 ? 6 : o.interval>=15 ? 3 : 2;
      const minGap = Math.floor(o.interval*0.5);
      const mine = assigned[o.c.id] = assigned[o.c.id] || [];
      let best = null;
      const consider = (from, to)=>{
        for(let i=from; i<=to && i<days.length; i++){
          const d = days[i], list = out.days[d];
          if(list.length >= dayCap(d, perDay)) continue;
          if(mine.some(x=>Math.abs((new Date(x+'T12:00:00')-new Date(d+'T12:00:00'))/86400000) < minGap || weekOf(x)===weekOf(d))) continue;
          const km = minKmToDay(o.c, list);
          const score = (i-start) + (list.length ? (km==null ? 1 : Math.min(km,30)*0.25) : 1);
          if(!best || score < best.score) best = { d, score };
        }
      };
      consider(start, start+slack);
      if(!best) consider(start+slack+1, days.length-1);
      if(!best){ out.unscheduled.push(o.c.id); return; }
      out.days[best.d].push(o.c.id); mine.push(best.d);
    });
    Object.keys(out.days).forEach(d=>{ out.days[d] = orderDayIds(out.days[d]); });
    return out;
  }
  /* ----- Rota fixa do Excel (folha "Calendario": Vendedor, Semana 1-4, Dia, Ordem, Cliente, Periodicidade) ----- */
  const ROUTE_DOW = { segunda:1, terca:2, quarta:3, quinta:4, sexta:5, sabado:6 };
  // linhas compactas: [vendedor, semana, diaSemana(1-6), ordem, cliente, periodicidade, chave]
  function parseRouteSheets(sheets){
    for(const sh of sheets){
      const rows = sh.rows || [];
      for(let h=0; h<Math.min(rows.length, 12); h++){
        const keys = (rows[h]||[]).map(normKey);
        const col = n => keys.indexOf(n);
        const cV = col('vendedor'), cW = col('semana'), cD = col('dia'), cC = col('cliente');
        if(cV<0 || cW<0 || cD<0 || cC<0) continue;
        const cO = col('ordem'), cP = col('periodicidade'), cK = col('chave');
        const out = []; let bad = 0;
        for(let i=h+1; i<rows.length; i++){
          const r = rows[i] || [];
          const vend = String(r[cV]==null?'':r[cV]).trim(), cli = String(r[cC]==null?'':r[cC]).trim();
          if(!vend && !cli) continue;
          const week = parseInt(r[cW],10), dow = ROUTE_DOW[normKey(r[cD])];
          if(!vend || !cli || !(week>=1 && week<=4) || !dow){ bad++; continue; }
          out.push([vend, week, dow, cO>=0 ? (parseInt(r[cO],10) || 0) : 0, cli, cP>=0 ? String(r[cP]==null?'':r[cP]).trim() : '', cK>=0 && normKey(r[cK])==='sim' ? 1 : 0]);
        }
        if(out.length) return { rows:out, bad, sheet:sh.name };
      }
    }
    return null;
  }
  function routeVendorId(excelName){
    const k = normKey(excelName); if(!k) return '';
    const vs = state.data.vendors;
    let m = vs.filter(v=>normKey(v.name)===k);
    if(!m.length) m = vs.filter(v=>normKey(v.name).split(' ')[0]===k);
    if(!m.length) m = vs.filter(v=>normKey(v.name).startsWith(k+' ') || k.startsWith(normKey(v.name)+' '));
    return m.length===1 ? m[0].id : '';
  }
  function routeClientFor(vendorId, name){
    const k = normKey(name);
    const m = state.data.clients.filter(c=>normKey(c.name)===k);
    return m.find(c=>c.vendorId===vendorId) || m[0] || null;
  }
  function routeRowsOf(vendorId){
    const r = state.data.routes; if(!r || !Array.isArray(r.rows)) return [];
    return r.rows.filter(x=>routeVendorId(x[0])===vendorId);
  }
  function routeWeekOf(date){ return Math.ceil(+date.slice(8,10) / 7); }
  // Semana do mês = blocos de 7 dias (dias 1-7 = semana 1…). A semana 5 (dias 29+) só leva os clientes semanais da semana 4.
  function generatePlanFromRoute(vendorId, month, sat){
    const days = planWorkingDays(month, sat);
    const out = { days:{}, unscheduled:[], noFreq:0, noCoords:0, total:0, missing:[], source:'route' };
    days.forEach(d=>{ out.days[d] = []; });
    const rows = routeRowsOf(vendorId);
    const miss = new Set();
    days.forEach(d=>{
      const dow = new Date(d+'T12:00:00').getDay();
      let wk = routeWeekOf(d), weeklyOnly = false;
      if(wk===5){ wk = 4; weeklyOnly = true; }
      const list = rows.filter(r=>r[1]===wk && r[2]===dow && (!weeklyOnly || normKey(r[5])==='semanal')).sort((a,b)=>a[3]-b[3]);
      list.forEach(r=>{
        const c = routeClientFor(vendorId, r[4]);
        if(!c){ miss.add(r[4]); return; }
        if(!out.days[d].includes(c.id)) out.days[d].push(c.id);
      });
    });
    out.missing = Array.from(miss);
    out.total = Object.values(out.days).reduce((a,l)=>a+l.length,0);
    return out;
  }
  // Garante visitas em TODOS os dias úteis do plano: os dias vazios (ex.: dias 29–31 na rota, ou poucos clientes) são
  // preenchidos com clientes da carteira/rota, dando prioridade aos que menos vezes foram planeados e há mais tempo sem visita.
  function fillEmptyDays(days, vendorId, perDay, useRoute){
    const dates = Object.keys(days).sort();
    const filled = [];
    // proposta automática: antes de acrescentar visitas, equilibra cada semana passando clientes dos dias mais cheios para os vazios (mesma semana, sem repetir)
    if(!useRoute){
      const weeks = {};
      dates.forEach(d=>{ (weeks[weekOf(d)] = weeks[weekOf(d)] || []).push(d); });
      Object.values(weeks).forEach(ds=>{
        for(let guard=0; guard<200; guard++){
          const empty = ds.filter(d=>!(days[d]||[]).length && dayCap(d, perDay)>0);
          if(!empty.length) break;
          const big = ds.slice().sort((a,b)=>days[b].length-days[a].length)[0];
          if(!big || days[big].length < 2) break;
          const to = empty[0];
          days[to] = [days[big].pop()];
          if(!filled.includes(to)) filled.push(to);
          if(!days[big].length) break;
        }
        // com todos os dias já com visitas, continua a equilibrar (máx. diferença de 1) respeitando o limite das segundas
        ds.forEach(()=>{
          const sorted = ds.slice().sort((a,b)=>days[a].length-days[b].length);
          const lo = sorted[0], hi = sorted[sorted.length-1];
          if(days[hi].length - days[lo].length > 1 && days[lo].length < dayCap(lo, perDay)){ days[lo].push(days[hi].pop()); }
        });
      });
      Object.keys(days).forEach(d=>{ days[d] = orderDayIds(days[d]); });
    }
    const empties = dates.filter(d=>!(days[d]||[]).length);
    if(!empties.length) return filled;
    const pool = new Map();
    portfolioOf(vendorId).forEach(c=>pool.set(c.id, c));
    if(useRoute) routeRowsOf(vendorId).forEach(r=>{ const c = routeClientFor(vendorId, r[4]); if(c) pool.set(c.id, c); });
    if(!pool.size) return filled;
    const cnt = {}; const lastPlanned = {};
    dates.forEach(d=>(days[d]||[]).forEach(id=>{ cnt[id] = (cnt[id]||0)+1; if(!lastPlanned[id] || d>lastPlanned[id]) lastPlanned[id] = d; }));
    const sizes = dates.map(d=>(days[d]||[]).length).filter(n=>n>0).sort((a,b)=>a-b);
    const median = sizes.length ? sizes[Math.floor(sizes.length/2)] : Math.min(perDay, 5);
    empties.forEach((d, ei)=>{
      const cap = dayCap(d, perDay);
      const target = Math.max(1, Math.min(cap, median, pool.size));
      const wk = weekOf(d);
      const inWeek = new Set();
      dates.forEach(x=>{ if(weekOf(x)===wk) (days[x]||[]).forEach(id=>inWeek.add(id)); });
      const near = new Set();
      [-1,1].forEach(k=>(days[dateAdd(d,k)]||[]).forEach(id=>near.add(id)));
      const cands = Array.from(pool.values()).filter(c=>!inWeek.has(c.id)).map(c=>{
        const lp = [lastVisitDateOf(c.id), ...dates.filter(x=>x<d && (days[x]||[]).includes(c.id))].sort().pop() || '';
        return { c, n: cnt[c.id]||0, adj: near.has(c.id)?1:0, last: lp };
      }).sort((a,b)=> a.adj-b.adj || a.n-b.n || (a.last<b.last ? -1 : a.last>b.last ? 1 : 0) || a.c.name.localeCompare(b.c.name));
      const left = empties.slice(ei).filter(x=>weekOf(x)===wk).length; // dias vazios que faltam nesta semana (incluindo este)
      const share = Math.max(1, Math.ceil(cands.length / left)); // reparte os clientes disponíveis da semana pelos dias vazios
      const pick = cands.slice(0, Math.min(target, share)).map(x=>x.c.id);
      if(!pick.length) return;
      days[d] = orderDayIds(pick);
      pick.forEach(id=>{ cnt[id] = (cnt[id]||0)+1; });
      filled.push(d);
    });
    return filled;
  }
  // ordem dentro do dia: nos planos da rota do Excel mantém-se a ordem do Excel (o que se acrescenta fica no fim)
  function planOrderIds(plan, ids){ return plan && plan.source==='route' ? ids : orderDayIds(ids); }
  // o Firestore não aceita listas dentro de listas: as linhas da rota guardam-se como texto JSON
  function routesToDoc(o){ return { fileName: o.fileName || '', importedAt: o.importedAt || null, rowsJson: JSON.stringify(o.rows || []) }; }
  function routesFromDoc(d){
    if(!d) return null;
    if(d.rowsJson){ let rows = []; try{ rows = JSON.parse(d.rowsJson) || []; }catch(e){} return { fileName:d.fileName||'', importedAt:d.importedAt||null, rows }; }
    return d;
  }
  async function saveRoutes(obj){
    if(state.dbMode==='live'){ if(obj) await db.doc('settings/routes').set(routesToDoc(obj)); else await db.doc('settings/routes').delete(); }
    state.data.routes = obj || null;
    if(state.dbMode==='offline') saveOfflineStore();
  }
  async function setClientVendorId(id, vendorId){
    const body = { vendorId };
    if(state.dbMode==='live'){ try{ await db.collection('clients').doc(id).update(body); }catch(e){ return false; } }
    const c = clientById(id); if(c) Object.assign(c, body);
    if(state.dbMode==='offline') saveOfflineStore();
    return true;
  }
  // resumo da importação: por vendedor do Excel
  function routePreview(rows, align){
    const by = {};
    rows.forEach(r=>{ (by[r[0]] = by[r[0]] || []).push(r); });
    const list = Object.keys(by).map(name=>{
      const vid = routeVendorId(name);
      const names = Array.from(new Set(by[name].map(r=>r[4])));
      const found = [], missing = [], elsewhere = [], noVendor = [];
      names.forEach(n=>{
        const c = routeClientFor(vid, n);
        if(!c){ missing.push(n); return; }
        found.push(c);
        if(vid && c.vendorId!==vid){ (c.vendorId ? elsewhere : noVendor).push(c); }
      });
      const toAlign = !vid ? [] : align==='all' ? elsewhere.concat(noVendor) : align==='empty' ? noVendor : [];
      return { name, vid, vname: vid ? vendorById(vid).name : '', visits: by[name].length, clients: names.length, found: found.length, missing, elsewhere: elsewhere.length, noVendor: noVendor.length, toAlign: toAlign.map(c=>c.id) };
    });
    return list;
  }
  async function savePlan(plan){
    const { id, ...body } = plan;
    body.updatedAt = nowIso();
    if(state.dbMode==='live'){ await db.doc('plans/'+id).set(body); }
    const arr = state.data.plans = state.data.plans || [];
    const i = arr.findIndex(x=>x.id===id);
    const full = { id, ...body };
    if(i>=0) arr[i] = full; else arr.push(full);
    if(state.dbMode==='offline') saveOfflineStore();
    return full;
  }
  // escreve as agendas diárias (coleção agendas) a partir do plano confirmado; mantém o que foi acrescentado à mão
  async function writePlanAgendas(plan){
    const vendor = vendorById(plan.vendorId);
    const today = todayDateStr();
    const dates = Object.keys(plan.days).filter(d=>d>=today).sort();
    let n = 0;
    for(const date of dates){
      const ids = plan.days[date] || [];
      const existing = await fetchAgendaDoc(plan.vendorId, date);
      const prevPlan = new Set((existing && existing.planIds) || []);
      const extras = existing ? (existing.clientIds||[]).filter(id=>!prevPlan.has(id) && !ids.includes(id)) : [];
      if(!existing && !ids.length) continue;
      const clientIds = [...ids, ...extras];
      const docId = plan.vendorId + '_' + date;
      const body = { vendorId: plan.vendorId, vendorName: vendor ? vendor.name : '', date, clientIds, planIds: ids.slice(),
        startLat: existing ? (existing.startLat ?? null) : null, startLng: existing ? (existing.startLng ?? null) : null, updatedBy:'plan', updatedAt: nowIso() };
      if(state.dbMode==='live'){ await db.doc('agendas/'+docId).set(body); }
      else{
        if(!state.data.agendas) state.data.agendas = [];
        const i = state.data.agendas.findIndex(a=>a.id===docId);
        if(i>=0) state.data.agendas[i] = { id:docId, ...body }; else state.data.agendas.push({ id:docId, ...body });
      }
      n++;
    }
    if(state.dbMode==='offline') saveOfflineStore();
    return n;
  }
  function planVisited(vendorId, clientId, fromDate){
    return state.data.visits.some(v=>v.vendorId===vendorId && v.clientId===clientId && localDateStr(v.timestamp) >= fromDate);
  }
  // reajuste diário: clientes planeados em dias passados e não visitados voltam para os próximos dias com vaga
  function planAdjustment(plan){
    const today = todayDateStr();
    const res = { moves:[], removes:[], adds:[], unplaced:[] };
    if(!plan || !plan.confirmedAt) return res;
    const carried = new Set(plan.carried||[]);
    const port = new Set(portfolioOf(plan.vendorId).map(c=>c.id));
    const dates = Object.keys(plan.days).sort();
    const future = dates.filter(d=>d>=today);
    const load = {}; future.forEach(d=>{ load[d] = (plan.days[d]||[]).slice(); });
    const planned = new Set(); dates.forEach(d=>(plan.days[d]||[]).forEach(id=>planned.add(id)));
    const place = (cid)=>{
      const c = clientById(cid);
      let best = null;
      future.forEach((d,i)=>{
        if(load[d].length >= dayCap(d, plan.perDay||8) || load[d].includes(cid) || clientInWeek(load, d, cid)) return;
        const km = c ? minKmToDay(c, load[d]) : null;
        const score = i + (load[d].length ? (km==null ? 1 : Math.min(km,30)*0.25) : 1);
        if(!best || score < best.score) best = { d, score };
      });
      if(best) load[best.d].push(cid);
      return best ? best.d : null;
    };
    const missedBy = {};
    dates.filter(d=>d<today).forEach(d=>{
      (plan.days[d]||[]).forEach(cid=>{
        const key = cid + '|' + d;
        if(carried.has(key) || !port.has(cid)) return;
        if(planVisited(plan.vendorId, cid, d)){ return; }
        (missedBy[cid] = missedBy[cid] || { cid, from:d, keys:[] }).keys.push(key);
      });
    });
    const soon = dateAdd(today, 7);
    Object.values(missedBy).forEach(m=>{
      const covered = future.some(d=> d<=soon && (plan.days[d]||[]).includes(m.cid));
      if(covered){ res.moves.push({ cid:m.cid, from:m.from, to:null, keys:m.keys }); return; }
      const to = place(m.cid);
      if(to) res.moves.push({ cid:m.cid, from:m.from, to, keys:m.keys }); else res.unplaced.push({ cid:m.cid, from:m.from, keys:m.keys });
    });
    future.forEach(d=>(plan.days[d]||[]).forEach(cid=>{ if(!port.has(cid)) res.removes.push({ cid, date:d }); }));
    const unsched = new Set(plan.unscheduled||[]);
    const known = new Set(plan.portfolio||[]);
    portfolioOf(plan.vendorId).forEach(c=>{
      if(!plan.portfolio || known.has(c.id) || planned.has(c.id) || unsched.has(c.id)) return; // só clientes que entraram na carteira depois de o plano ser gerado
      const to = place(c.id);
      if(to) res.adds.push({ cid:c.id, to }); else res.unplaced.push({ cid:c.id, from:null, keys:[] });
    });
    return res;
  }

    const today = todayDateStr(); const carried = new Set(plan.carried||[]);

    Object.keys(plan.days).forEach(d=>{ if(d>today) return; (plan.days[d]||[]).forEach(cid=>{
      if(carried.has(cid+'|'+d)) return;
      planned++; if(planVisited(plan.vendorId, cid, d)) done++;
    }); });
    return { planned, done };
  }

  function visitMatchCT(v, canal, tipo){
    if(!canal && !tipo) return true;
    const c = clientById(v.clientId);
    const ch = (c && c.channel) ? c.channel : '', ty = (c && c.establishmentType) ? c.establishmentType : '';
    if(canal==='__none' ? !!ch : (canal && ch!==canal)) return false;
    if(tipo==='__none' ? !!ty : (tipo && ty!==tipo)) return false;
    return true;
  }
  // Tudo o que o fornecedor vê sai daqui: só linhas de visita que dizem respeito aos produtos dele
  function supplierReportData(sup){
    const prods = supplierProductsOf(sup.name);
    const names = new Set(prods.map(p=>p.name));
    const cats = Array.from(new Set(prods.map(p=> productCategories().includes(p.category) ? p.category : FALLBACK_CATEGORY)));
    const period = state.supPeriod || 'all', canal = state.supCanal || '', tipo = state.supTipo || '';
    const periodVisits = reportFilterVisits(period, state.supStart, state.supEnd).filter(v=>visitMatchCT(v, canal, tipo));
    const mine = periodVisits.filter(v=> (v.productChecks||[]).some(x=>names.has(x.product)) || (v.orderItems||[]).some(x=>names.has(x.product)));
    const clients = new Set(mine.map(v=>v.clientId));
    const qty = {}, qtyOrder = [], totals = { caixas:0, unidades:0 };
    const byClient = {}, byVendor = {};
    let orderVisits = 0;
    mine.forEach(v=>{
      const items = (v.orderItems||[]).filter(o=>names.has(o.product));
      if(!items.length) return;
      orderVisits++;
      const cn = clientById(v.clientId);
      const ck = v.clientId || v.clientName || '?';
      (byClient[ck] = byClient[ck] || { name:(cn&&cn.name)||v.clientName||'Cliente', count:0 }).count++;
      const vn = vendorNameOf(v);
      (byVendor[vn] = byVendor[vn] || { name:vn, count:0 }).count++;
      items.forEach(o=>{
        const q = parseFloat(o.quantity) || 0, unit = o.unit==='unidades' ? 'unidades' : 'caixas', key = o.product + '|' + unit;
        if(!(key in qty)){ qty[key] = 0; qtyOrder.push(key); }
        qty[key] += q; totals[unit] += q;
      });
    });
    const orders = qtyOrder.map(k=>{ const [product,unit] = k.split('|'); return { product, unit, qty:qty[k] }; }).sort((a,b)=>b.qty-a.qty);
    const shelf = prods.map(p=>{
      let n = 0, avail = 0; const pu = [], pb = [], po = [];
      mine.forEach(v=>(v.productChecks||[]).forEach(x=>{
        if(x.product!==p.name) return;
        n++; if(x.available) avail++;
        if(!x.available) return;
        const u = parsePriceNum(x.priceUnit), b = parsePriceNum(x.priceBox);
        if(u!=null) pu.push(u);
        if(b!=null) pb.push(b);
        if(u==null && b==null){ const o = parsePriceNum(x.price); if(o!=null) po.push(o); }   // preço antigo, sem unidade/caixa
      }));
      return { name:p.name, category: productCategories().includes(p.category) ? p.category : FALLBACK_CATEGORY, active:p.active!==false, n, avail, pricesUnit:pu, pricesBox:pb, pricesOther:po };
    });
    const shelfN = shelf.reduce((a,x)=>a+x.n,0), shelfAvail = shelf.reduce((a,x)=>a+x.avail,0);
    const cnt = (keyFn)=>{ const m = {}; mine.forEach(v=>{ const k = keyFn(v); m[k] = (m[k]||0)+1; }); return m; };
    const byChannel = Object.entries(cnt(v=>{ const c = clientById(v.clientId); return (c&&c.channel) ? c.channel : '—'; }))
      .map(([k,count])=>({ name: CHANNEL_META[k] ? CHANNEL_META[k].label : 'Sem canal definido', count })).sort((a,b)=>b.count-a.count);
    const byType = Object.entries(cnt(v=>{ const c = clientById(v.clientId); return (c&&c.establishmentType) ? c.establishmentType : 'Não definido'; }))
      .map(([name,count])=>({ name, count })).sort((a,b)=>b.count-a.count);
    const comp = competitionAggregate(periodVisits, '', '', cats);
    const nd = numericDistribution(periodVisits, '', '', prods.map(p=>p.name));
    return { nd,
      sup, prods, cats, visits: mine.length, clients: clients.size, orderVisits, totals, orders, shelf, shelfN, shelfAvail,
      byClient: Object.values(byClient).sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name)),
      byVendor: Object.values(byVendor).sort((a,b)=>b.count-a.count || a.name.localeCompare(b.name)),
      byChannel, byType, comp, periodLabel: supPeriodLabel(), canal, tipo
    };
  }

    const names = { all:'Todo o período', today:'Hoje', '7d':'Últimos 7 dias', '30d':'Últimos 30 dias', custom:'Dias específicos' };

  function buildSupplierXlsx(d){
    const H = a => a.map(t=>({ v:t, s:'head' }));
    const I = n => ({ v:n, s:'int' }), M = n => (n==null ? '' : { v:n, s:'money' });
    const dt = new Date().toLocaleString('pt-PT', { dateStyle:'short', timeStyle:'short' });
    const filt = `Canal: ${d.canal==='__none'?'Sem canal definido':d.canal?(CHANNEL_META[d.canal]?.label||d.canal):'Todos'} | Tipo: ${d.tipo==='__none'?'Não definido':d.tipo||'Todos'}`;
    const sheets = [];
    sheets.push({ name:'Resumo', widths:[36,46], rows:[
      [{ v:'Relatório do fornecedor', s:'title' }], [{ v:APP_NAME_FULL, s:'note' }], [],
      [{ v:'Fornecedor', s:'bold' }, d.sup.name], [{ v:'Período', s:'bold' }, d.periodLabel], [{ v:'Filtros', s:'bold' }, filt], [{ v:'Gerado em', s:'bold' }, dt], [],
      [{ v:'Visitas com os seus produtos', s:'bold' }, I(d.visits)], [{ v:'Clientes', s:'bold' }, I(d.clients)],
      [{ v:'Caixas encomendadas', s:'bold' }, I(d.totals.caixas)], [{ v:'Unidades encomendadas', s:'bold' }, I(d.totals.unidades)],
      [{ v:'Encomendas (visitas)', s:'bold' }, I(d.orderVisits)],
      [{ v:'Presença na prateleira', s:'bold' }, d.shelfN ? { v:d.shelfAvail/d.shelfN, s:'pct' } : '—'],
    ]});
    sheets.push({ name:'Encomendas por produto', freeze:1, widths:[34,12,12], rows:[ H(['Produto','Unidade','Quantidade']), ...d.orders.map(o=>[o.product, o.unit, I(o.qty)]) ]});
    sheets.push({ name:'Prateleira', freeze:1, widths:[34,22,12,12,12,14,14,14,14,14,14,16], rows:[
      H(['Produto','Categoria','Verificações','Disponível','Presença','Unidade média','Unidade mín.','Unidade máx.','Caixa média','Caixa mín.','Caixa máx.','Sem un./cx. (média)']),
      ...d.shelf.map(x=>{ const su = priceStat(x.pricesUnit), sb = priceStat(x.pricesBox), so = priceStat(x.pricesOther);
        return [x.name, x.category, I(x.n), I(x.avail), x.n ? { v:x.avail/x.n, s:'pct' } : '', su?M(su.avg):'', su?M(su.min):'', su?M(su.max):'', sb?M(sb.avg):'', sb?M(sb.min):'', sb?M(sb.max):'', so?M(so.avg):'']; }),
    ]});
    sheets.push({ name:'Distribuição numérica', freeze:3, widths:[34,22,16,16,14], rows:[
      [{ v:'% dos clientes onde o produto foi verificado e estava em stock (última verificação de cada cliente).', s:'note' }], [],
      H(['Produto','Categoria','Clientes em stock','Clientes verificados','Distribuição (%)']),
      ...d.nd.rows.map(r=>[r.name, r.category, I(r.present), I(r.base), { v:r.present/r.base, s:'pct' }]),
      ...d.nd.noData.map(r=>[r.name, r.category, '', I(0), '—']),
    ]});
    sheets.push({ name:'Encomendas por vendedor', freeze:1, widths:[30,16], rows:[ H(['Vendedor','Encomendas']), ...d.byVendor.map(x=>[x.name, I(x.count)]) ]});
    sheets.push({ name:'Canal e tipo', widths:[30,10], rows:[ H(['Canal','Visitas']), ...d.byChannel.map(x=>[x.name, I(x.count)]), [], H(['Tipo de estabelecimento','Visitas']), ...d.byType.map(x=>[x.name, I(x.count)]) ]});
    const crows = [];
    d.comp.list.forEach(g=>Object.values(g.prods).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name)).forEach(pr=>{
      const u = priceStat(pr.unit), b = priceStat(pr.box);
      crows.push([g.name, pr.name, pr.cat, I(g.visits), u?M(u.avg):'', u?M(u.min):'', u?M(u.max):'', b?M(b.avg):'', b?M(b.min):'', b?M(b.max):'']);
    }));
    sheets.push({ name:'Concorrência', freeze:3, widths:[24,26,18,10,12,10,10,12,10,10], rows:[
      [{ v:'Preços em MT, nas categorias dos produtos do fornecedor.', s:'note' }], [],
      H(['Concorrente','Produto','Categoria','Visitas','Média unidade','Mín. unidade','Máx. unidade','Média caixa','Mín. caixa','Máx. caixa']), ...crows ]});
    return buildXlsx(sheets);
  }

  function ordDeskRange(){
    const t = todayDateStr(); const a = state.ordFrom || t, b = state.ordTo || t;
    return a<=b ? { from:a, to:b } : { from:b, to:a };

  function ordDeskVisits(){
    const { from, to } = ordDeskRange();
    return state.data.visits.filter(v=>{
      if(!(v.orderItems||[]).length) return false;
      const d = localDateStr(v.timestamp); if(d<from || d>to) return false;
      if(state.ordVendor && v.vendorId!==state.ordVendor) return false;
      if(state.ordDeliv==='pendente' && isDelivered(v)) return false;
      if(state.ordDeliv==='entregue' && !isDelivered(v)) return false;
      return true;
    }).sort((a,b)=> a.timestamp<b.timestamp ? 1 : -1);
  }
  function ordersTotalsOf(visits){
    const totals = {}, order = [];
    visits.forEach(v=>(v.orderItems||[]).forEach(o=>{
      const unit = o.unit==='unidades' ? 'unidades' : 'caixas'; const key = o.product + '|' + unit;
      if(!(key in totals)){ totals[key] = 0; order.push(key); }
      totals[key] += parseFloat(o.quantity) || 0;
    }));
    return { totals, order };
  }
  function ordDeskLabel(){
    const { from, to } = ordDeskRange();
    return from===to ? `do dia ${fmtDateOnly(from)}` : `de ${fmtDateOnly(from)} a ${fmtDateOnly(to)}`;
  }
  function buildOrdersMailtoFor(visits, label, filterNote){
    const { totals, order } = ordersTotalsOf(visits);
    const lines = [`Encomendas ${label}`]; if(filterNote) lines.push(filterNote); lines.push('');
    if(order.length){ lines.push('Total por produto:'); order.forEach(k=>{ const [pr,un] = k.split('|'); lines.push(`- ${pr}: ${totals[k]} ${un}`); }); lines.push(''); }
    lines.push('Detalhe por visita:');
    visits.slice().sort((a,b)=> a.timestamp<b.timestamp ? -1 : 1).forEach(v=>{
      const cn = clientById(v.clientId);
      lines.push(`• ${v.clientName}${cn && cn.clientNumber ? ' [Nº ' + cn.clientNumber + ']' : ''} (${vendorNameOf(v)}, ${fmtDateTime(v.timestamp)})${isDelivered(v) ? ' — entregue' : ' — entrega pendente'}`);
      (v.orderItems||[]).forEach(o=>{ lines.push(`   - ${o.product}: ${o.quantity} ${o.unit==='unidades' ? 'unidades' : 'caixas'}`); });
    });
    return `mailto:${ordersEmail()}?subject=${encodeURIComponent('Encomendas ' + label)}&body=${encodeURIComponent(lines.join('\n'))}`;
  }

  /* ============ VENDOR: HOME ============ */
  /* ----- Meta de visitas do vendedor (agendadas vs feitas): semana (seg–dom) e mês ----- */
  function vendorGoalRanges(){
    const today = todayDateStr();
    const ws = weekOf(today), we = dateAdd(ws, 6);
    const [y,m] = today.split('-').map(Number);
    const ms = today.slice(0,7) + '-01', me = today.slice(0,7) + '-' + String(new Date(y, m, 0).getDate()).padStart(2,'0');
    return { today, ws, we, ms, me };
  }
  async function loadVendorGoals(force){
    const g = state.vendorGoals; const vid = state.session && state.session.vendorId;
    if(!vid || g.loading) return;
    if(!force && g.vid===vid && g.loadedAt && Date.now()-g.loadedAt < 60000) return;
    g.loading = true;
    const r = vendorGoalRanges();
    const from = r.ws < r.ms ? r.ws : r.ms, to = r.we > r.me ? r.we : r.me;
    let list = [];
    try{
      if(state.dbMode==='live'){
        const snap = await db.collection('agendas').where('date','>=',from).where('date','<=',to).limit(1000).get();
        list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      }else{
        list = (state.data.agendas||[]).filter(a=>a.date>=from && a.date<=to);
      }
    }catch(e){ list = (g.vid===vid ? g.list : []); }
    g.list = list.filter(a=>a.vendorId===vid);
    g.vid = vid; g.loadedAt = Date.now(); g.loading = false;
    if(state.view==='home' && state.session && state.session.role==='vendor') renderView();
  }
  function vendorGoalStats(start, end){
    const vid = state.session.vendorId, today = todayDateStr();
    const ag = state.vendorGoals.list.filter(a=>a.date>=start && a.date<=end);
    const meta = ag.reduce((n,a)=>n+(a.clientIds||[]).length, 0);
    const metaToDate = ag.filter(a=>a.date<=today).reduce((n,a)=>n+(a.clientIds||[]).length, 0);
    const done = state.data.visits.filter(v=>{ if(v.vendorId!==vid) return false; const d = localDateStr(v.timestamp); return d>=start && d<=end; }).length;
    return { meta, metaToDate, done };
  }
  function vendorGoalRowHtml(label, sub, st, ready){
    const pct = st.meta ? Math.round(st.done/st.meta*100) : 0;
    const w = Math.max(0, Math.min(100, pct));
    const full = st.meta && st.done >= st.meta;
    let note = '';
    if(!ready) note = `<span class="hint" style="margin:0;">A carregar a meta…</span>`;
    else if(!st.meta) note = `<span class="hint" style="margin:0;">Sem visitas agendadas neste período.</span>`;
    else{
      const late = st.metaToDate - st.done;
      const chip = !st.metaToDate ? `<span class="chip status-neutral">Ainda sem visitas previstas até hoje</span>`
        : late > 0 ? `<span class="chip status-warn">Atraso de ${late} visita(s)</span>` : `<span class="chip status-good">Em dia</span>`;
      note = `${chip}<span class="hint" style="margin:0;">Até hoje: ${st.done} de ${st.metaToDate} previstas${st.done < st.meta ? ` · faltam ${st.meta - st.done} no total` : ' · meta cumprida'}</span>`;
    }
    return `
      <div class="stack" style="gap:6px;">
        <div class="row-wrap" style="justify-content:space-between; align-items:baseline; gap:8px;">
          <div style="min-width:0;"><div class="client-name">${esc(label)}</div><div class="client-addr">${esc(sub)}</div></div>
          <div class="mono" style="font-size:20px; font-weight:600; white-space:nowrap;">${st.done}<span style="color:var(--ink-muted); font-size:15px;"> / ${ready ? st.meta : '–'}</span></div>
        </div>
        <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${w}" aria-label="${esc(label)}: ${st.done} de ${st.meta} visitas" style="height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden;">
          <div style="height:100%; width:${ready ? w : 0}%; background:${full ? 'var(--status-good-fg)' : 'var(--accent)'}; border-radius:4px;"></div>
        </div>
        <div class="row-wrap" style="gap:8px; align-items:center;">${ready && st.meta ? `<span class="mono" style="font-size:13px; font-weight:600;">${pct}%</span>` : ''}${note}</div>
      </div>`;
  }
  function vendorGoalCardHtml(){
    const r = vendorGoalRanges();
    loadVendorGoals();
    const ready = state.vendorGoals.vid===state.session.vendorId && !!state.vendorGoals.loadedAt;
    const dm = d => d.slice(8,10) + '/' + d.slice(5,7);
    const wk = vendorGoalStats(r.ws, r.we), mo = vendorGoalStats(r.ms, r.me);
    return `
      <div class="card stack" style="gap:14px;">
        <div class="section-title" style="margin:0;">Meta de visitas</div>
        <div class="hint" style="margin:0;">Meta = visitas agendadas; feitas = visitas registadas.</div>
        ${vendorGoalRowHtml('Esta semana', dm(r.ws) + ' a ' + dm(r.we), wk, ready)}
        ${vendorGoalRowHtml('Este mês', monthLabel(r.today.slice(0,7)), mo, ready)}
      </div>`;
  }
  function viewVendorHome(){
    const vId = state.session.vendorId;
    const myVisits = state.data.visits.filter(v=>v.vendorId===vId);
    const todayCount = myVisits.filter(v=> daysSince(v.timestamp)===0).length;
    const weekCount = myVisits.filter(v=> daysSince(v.timestamp)<7).length;
    const myClientIds = new Set(myVisits.map(v=>v.clientId));

    const stale = state.data.clients
      .map(c=>({ c, s: clientStats(c.id) }))
      .filter(x=> x.s.last===null || daysSince(x.s.last) >= 14)
      .sort((a,b)=>{
        const da = a.s.last ? daysSince(a.s.last) : Infinity;
        const db_ = b.s.last ? daysSince(b.s.last) : Infinity;
        return db_ - da;
      })
      .slice(0,5);

    return `
      <div class="stack">
        <h2>Olá, ${esc(state.session.vendorName)}</h2>
        ${vendorGoalCardHtml()}
        <div class="statgrid">
          <div class="stat-tile"><div class="stat-num mono">${todayCount}</div><div class="stat-label">Visitas hoje</div></div>
          <div class="stat-tile"><div class="stat-num mono">${weekCount}</div><div class="stat-label">Últimos 7 dias</div></div>
          <div class="stat-tile"><div class="stat-num mono">${myVisits.length}</div><div class="stat-label">Total registado</div></div>
          <div class="stat-tile"><div class="stat-num mono">${myClientIds.size}</div><div class="stat-label">Clientes visitados</div></div>
        </div>
        <div class="row-wrap">
          <button class="btn btn-primary" onclick="App.startNewVisit()">${icon('plus')} Nova visita</button>
          <button class="btn btn-secondary" onclick="App.startAgendaToday()">${icon('map')} Agenda de hoje</button>
          <button class="btn btn-secondary" onclick="App.goto('clients')">${icon('clients')} Ver clientes</button>
        </div>
        <div>
          <div class="section-title">Sem visita recente (14+ dias)</div>
          ${stale.length ? `<div class="stack" style="gap:8px;">
            ${stale.map(x=>`
              <div class="client-card">
                <div>
                  <div class="client-name">${esc(x.c.name)}</div>
                  <div class="client-addr">${esc(x.c.address || 'sem morada registada')}</div>
                  <div class="client-recency chip status-warn" style="margin-top:6px;">${fmtRecency(x.s.last)}</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="App.startVisitFor('${x.c.id}')">Visitar</button>
              </div>
            `).join('')}
          </div>` : `<div class="empty-state"><p>Todos os clientes foram visitados recentemente.</p></div>`}
        </div>
      </div>
    `;
  }
