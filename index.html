      const known = cur.find(x=>x.competitor.toLowerCase()===competitor.toLowerCase());
      const category = productCategories().includes(state.mgrCompNew.category) ? state.mgrCompNew.category : productCategories()[0];
      await saveCompetitorProducts([...cur, { id:uid(), competitor: known ? known.competitor : competitor, product, category, active:true }]);
      state.mgrCompNew = { competitor: known ? known.competitor : competitor, product:'', category }; // mantém concorrente e categoria para registar vários produtos seguidos
      showToast('Produto concorrente adicionado.');
      renderView();
      const el = document.getElementById('mgrCompNewProduct'); if(el) el.focus();
    },
    mgrToggleEditComp(id){
      if(state.mgrCompEditId===id){ state.mgrCompEditId = null; }
      else{ const x = compById(id); state.mgrCompEditId = id; state.mgrCompDraft = { competitor:x?x.competitor:'', product:x?x.product:'', category:x?compCat(x):FALLBACK_CATEGORY }; }
      renderView();
    },
    async mgrSaveComp(id){
      const x = compById(id); if(!x) return;
      const competitor = (state.mgrCompDraft.competitor||'').replace(/\s+/g,' ').trim();
      const product = (state.mgrCompDraft.product||'').replace(/\s+/g,' ').trim();
      if(!competitor || !product){ showToast('Indique o concorrente e o produto.'); return; }
      if(compCatalog().some(y=>y.id!==id && y.competitor.toLowerCase()===competitor.toLowerCase() && y.product.toLowerCase()===product.toLowerCase())){ showToast('Esse produto já está registado para este concorrente.'); return; }
      const category = productCategories().includes(state.mgrCompDraft.category) ? state.mgrCompDraft.category : FALLBACK_CATEGORY;
      await saveCompetitorProducts(compCatalog().map(y=> y.id===id ? { ...y, competitor, product, category } : y));
      state.mgrCompEditId = null;
      showToast('Produto concorrente atualizado.');
      renderView();
    },
    async mgrToggleCompActive(id){
      const cur = compCatalog();
      await saveCompetitorProducts(cur.map(y=> y.id===id ? { ...y, active: y.active===false } : y));
      renderView();
    },
    async mgrRemoveComp(id){
      await saveCompetitorProducts(compCatalog().filter(y=>y.id!==id));
      if(state.mgrCompEditId===id) state.mgrCompEditId = null;
      showToast('Produto concorrente removido.');
      renderView();
    },
    mgrToggleCats(){ state.mgrCatOpen = !state.mgrCatOpen; state.mgrCatEditIdx = null; state.mgrCatDelIdx = null; renderView(); },
    mgrCatNewInput(v){ state.mgrCatNew = v; },
    mgrCatDraftInput(v){ state.mgrCatDraft = v; },
    async mgrAddCat(){
      const name = (state.mgrCatNew||'').replace(/\s+/g,' ').trim();
      if(!name){ showToast('Indique o nome da categoria.'); return; }
      const cats = productCategories();
      if(cats.some(c=>c.toLowerCase()===name.toLowerCase())){ showToast('Essa categoria já existe.'); return; }
      const list = cats.filter(c=>c!==FALLBACK_CATEGORY); list.push(name);
      await saveCategories(list);
      state.mgrCatNew = '';
      showToast('Categoria adicionada.');
      renderView();
      const el = document.getElementById('mgrCatNewInput'); if(el) el.focus();
    },
    async mgrMoveCat(i, dir){
      const list = productCategories().filter(c=>c!==FALLBACK_CATEGORY);
      const j = i + dir;
      if(i<0 || j<0 || i>=list.length || j>=list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      state.mgrCatEditIdx = null; state.mgrCatDelIdx = null;
      await saveCategories(list);
      renderView();
    },
    mgrEditCat(i){
      if(state.mgrCatEditIdx===i){ state.mgrCatEditIdx = null; }
      else{ state.mgrCatEditIdx = i; state.mgrCatDraft = productCategories()[i] || ''; state.mgrCatDelIdx = null; }
      renderView();
    },
    async mgrSaveCat(i){
      const cats = productCategories(); const old = cats[i];
      if(old==null || old===FALLBACK_CATEGORY) return;
      const name = (state.mgrCatDraft||'').replace(/\s+/g,' ').trim();
      if(!name){ showToast('Indique o nome da categoria.'); return; }
      if(name===old){ state.mgrCatEditIdx = null; renderView(); return; }
      if(cats.some((c,k)=>k!==i && c.toLowerCase()===name.toLowerCase())){ showToast('Já existe uma categoria com esse nome.'); return; }
      const list = cats.filter(c=>c!==FALLBACK_CATEGORY).map(c=> c===old ? name : c);
      const prods = (state.data.products||[]);
      const comps = compCatalog();
      const movedP = prods.filter(p=>p.category===old).length, movedC = comps.filter(x=>x.category===old).length;
      const moved = movedP + movedC;
      // grava primeiro os produtos (com o nome novo) e depois a lista, para nunca ficarem produtos numa categoria inexistente
      if(movedP) await saveProducts(prods.map(p=> p.category===old ? { ...p, category:name } : p));
      if(movedC) await saveCompetitorProducts(comps.map(x=> x.category===old ? { ...x, category:name } : x));
      await saveCategories(list);
      if(state.pf.cat===old) state.pf.cat = name;
      if(state.mgrCompCat===old) state.mgrCompCat = name;
      if(state.mgrCompListCat===old) state.mgrCompListCat = name;
      if(state.mgrCompNew.category===old) state.mgrCompNew.category = name;
      state.mgrCatEditIdx = null;
      showToast(moved ? `Categoria renomeada (${moved} produto(s) atualizado(s)).` : 'Categoria renomeada.');
      renderView();
    },
    mgrAskDelCat(i){ state.mgrCatDelIdx = state.mgrCatDelIdx===i ? null : i; state.mgrCatEditIdx = null; renderView(); },
    async mgrDelCat(i){
      const cats = productCategories(); const old = cats[i];
      if(old==null || old===FALLBACK_CATEGORY) return;
      const prods = (state.data.products||[]);
      const comps = compCatalog();
      const movedP = prods.filter(p=>p.category===old).length, movedC = comps.filter(x=>x.category===old).length;
      const moved = movedP + movedC;
      if(movedP) await saveProducts(prods.map(p=> p.category===old ? { ...p, category:FALLBACK_CATEGORY } : p));
      if(movedC) await saveCompetitorProducts(comps.map(x=> x.category===old ? { ...x, category:FALLBACK_CATEGORY } : x));
      await saveCategories(cats.filter(c=>c!==old));
      if(state.pf.cat===old) state.pf.cat = '';
      if(state.mgrCompCat===old) state.mgrCompCat = '';
      if(state.mgrCompListCat===old) state.mgrCompListCat = '';
      if(state.mgrCompNew.category===old) state.mgrCompNew.category = '';
      state.mgrCatDelIdx = null;
      showToast(moved ? `Categoria removida (${moved} produto(s) passaram para "${FALLBACK_CATEGORY}").` : 'Categoria removida.');
      renderView();
    },
    mgrToggleReportExport(){ state.mgrReportExportOpen = !state.mgrReportExportOpen; renderView(); },
    async exportReport(kind){
      if(state.mgrReportExporting) return;
      state.mgrReportExporting = true;
      try{
        showToast('A preparar o ' + (kind==='pdf' ? 'PDF' : 'Excel') + '…');
        await new Promise(r=>setTimeout(r, 30));
        const d = buildReportData();
        const blob = kind==='pdf' ? buildReportPdf(d) : buildReportXlsx(d);
        const r = await saveBlobToUser(blob, reportFilename(kind));
        if(r==='saved') showToast(kind==='pdf' ? 'PDF do relatório pronto.' : 'Excel do relatório pronto.');
        else if(r==='declined') showToast('Download cancelado.');
        else showToast('Não foi possível guardar o ficheiro neste dispositivo.');
      }catch(e){ showToast('Erro ao gerar o ficheiro.'); }
      state.mgrReportExporting = false;
      if(state.view==='mReport') renderView();
    },
    mgrConvSet(which, value){
      if(which==='by') state.mgrConvBy = value || 'vendor';
      else if(which==='vendor'){ state.mgrConvVendor = value || ''; state.mgrConvCanal = ''; }   // os canais dependem do vendedor
      else if(which==='canal') state.mgrConvCanal = value || '';
      else state.mgrConvExcl = !!value;
      const box = document.getElementById('convBox');
      if(box) box.innerHTML = reportConvCardHtml(currentReportVisits());
    },
    mgrNdFilter(which, value){
      if(which==='canal'){
        state.mgrNdCanal = value || '';
        if(state.mgrNdTipo && state.mgrNdTipo!=='__none' && !compTipoOptions(state.mgrNdCanal).includes(state.mgrNdTipo)) state.mgrNdTipo = '';
      }else state.mgrNdTipo = value || '';
      const box = document.getElementById('ndBox');
      if(box) box.innerHTML = reportNdCardHtml(currentReportVisits());
    },
    mgrCompFilter(which, value){
      if(which==='canal'){
        state.mgrCompCanal = value || '';
        const valid = compTipoOptions(state.mgrCompCanal);
        if(state.mgrCompTipo && state.mgrCompTipo!=='__none' && !valid.includes(state.mgrCompTipo)) state.mgrCompTipo = '';
      }else if(which==='cat'){
        state.mgrCompCat = value || '';
      }else{
        state.mgrCompTipo = value || '';
      }
      const box = document.getElementById('compReportBox');
      if(box) box.innerHTML = reportCompetitionCardHtml(currentReportVisits());
    },
    mgrSetProdSupplier(value){
      state.mgrProdSupplier = value || '';
      state.mgrEditProductIdx = null;
      renderView();
    },
    async mgrToggleProductActive(index){
      const current = state.data.products || [];
      if(index < 0 || index >= current.length) return;
      const updated = current.map((p,i)=> i===index ? { ...p, active: p.active===false } : p);
      await saveProducts(updated);
      showToast(updated[index].active ? 'Produto ativado.' : 'Produto desativado.');
      renderView();
    },
    mgrChangeOrdersDate(value){
      state.mgrOrdersDate = value || todayDateStr();
      renderView();
    },
    mgrChangeReportVendor(value){
      state.mgrReportVendor = value || '';
      renderView();
    },
    mgrChangeReportPeriod(value){
      state.mgrReportPeriod = value || 'all';
      renderView();
      loadReportAgendas();
    },
    mgrChangeReportCustomDate(which, value){
      if(which==='start') state.mgrReportCustomStart = value || null;
      else if(which==='end') state.mgrReportCustomEnd = value || null;
      renderView();
      loadReportAgendas();
    },

    toggleDelivFields(prefix){
      const st = document.getElementById(prefix+'Status');
      const wrap = document.getElementById(prefix+'AtWrap');
      const at = document.getElementById(prefix+'At');
      if(!st || !wrap) return;
      const on = st.value==='entregue';
      wrap.style.display = on ? '' : 'none';
      if(on && at && !at.value) at.value = toLocalInputValue(nowIso());
    },
    toggleDeliveryEdit(id){
      state.deliveryEditId = state.deliveryEditId===id ? null : id;
      renderView();
    },
    async saveDelivery(id, delivered){
      const v = state.data.visits.find(x=>x.id===id);
      if(!v) return;
      let delivery;
      if(delivered){
        const raw = document.getElementById('delivAt_'+id)?.value || '';
        const iso = fromLocalInputValue(raw) || nowIso();
        if(new Date(iso).getTime() > Date.now() + 5*60000){ showToast('A data da entrega não pode estar no futuro.'); return; }
        if(new Date(iso).getTime() < new Date(v.timestamp).getTime() - 5*60000){ showToast('A entrega não pode ser anterior à visita.'); return; }
        delivery = { status:'entregue', deliveredAt: iso };
      }else{
        delivery = { status:'pendente', deliveredAt:null };
      }
      await updateVisit(id, { delivery, deliveryBy: actorName() });
      state.deliveryEditId = null;
      showToast(delivered ? 'Entrega confirmada.' : 'Entrega marcada como pendente.');
      renderView();
    },
    setHistoryDate(which, value){
      if(which==='from') state.histFrom = value || null; else state.histTo = value || null;
      if(state.histFrom && state.histTo && state.histFrom > state.histTo){
        // intervalo invertido: alinha o outro limite
        if(which==='from') state.histTo = state.histFrom; else state.histFrom = state.histTo;
      }
      renderView();
    },
    setHistoryRange(kind){
      if(kind==='all'){ state.histFrom = null; state.histTo = null; }
      else{
        const r = reportDateRange(kind, null, null);
        state.histFrom = r.start; state.histTo = r.end;
      }
      renderView();
    },
    startAgendaToday(){ loadAgendaForDate(todayDateStr()); },
    changeAgendaDate(date){ loadAgendaForDate(date); },
    setAgendaToday(){ loadAgendaForDate(todayDateStr()); },
    async captureAgendaStart(){
      state.agenda.startGpsStatus='loading'; renderView();
      try{
        const pos = await getPosition();
        state.agenda.startLat = pos.lat; state.agenda.startLng = pos.lng;
        state.agenda.startGpsStatus='ok';
      }catch(e){ state.agenda.startGpsStatus='error'; }
      renderView();
    },
    addToAgenda(clientId){
      if(!state.agenda.clientIds.includes(clientId)) state.agenda.clientIds.push(clientId);
      renderView();
    },
    removeFromAgenda(clientId){
      state.agenda.clientIds = state.agenda.clientIds.filter(id=>id!==clientId);
      renderView();
    },
    moveAgendaStop(index, dir){
      const arr = state.agenda.clientIds;
      const newIndex = index + dir;
      if(newIndex < 0 || newIndex >= arr.length) return;
      [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
      renderView();
    },
    reorderAgendaByProximity(){
      const chosen = state.agenda.clientIds.map(id=>clientById(id)).filter(Boolean);
      const start = state.agenda.startLat!=null ? { lat:state.agenda.startLat, lng:state.agenda.startLng } : null;
      const ordered = orderByProximity(chosen, start);
      state.agenda.clientIds = ordered.map(c=>c.id);
      renderView();
    },
    mgrPickAgendaVendor(vendorId){ loadMgrAgenda(vendorId || null, state.mgrAgenda.date || todayDateStr()); },
    mgrChangeAgendaDate(date){ if(!date) return; loadMgrAgenda(state.mgrAgenda.vendorId, date); },
    mgrAddToAgenda(clientId){
      const m = state.mgrAgenda;
      if(!m.clientIds.includes(clientId)) m.clientIds.push(clientId);
      m.dirty = true; renderView();
    },
    mgrRemoveFromAgenda(clientId){
      const m = state.mgrAgenda;
      m.clientIds = m.clientIds.filter(id=>id!==clientId);
      m.dirty = true; renderView();
    },
    mgrMoveAgendaStop(index, dir){
      const m = state.mgrAgenda; const arr = m.clientIds; const ni = index + dir;
      if(ni < 0 || ni >= arr.length) return;
      [arr[index], arr[ni]] = [arr[ni], arr[index]];
      m.dirty = true; renderView();
    },
    mgrReorderAgendaByProximity(){
      const m = state.mgrAgenda;
      const chosen = m.clientIds.map(id=>clientById(id)).filter(Boolean);
      const start = m.startLat!=null ? { lat:m.startLat, lng:m.startLng } : null;
      m.clientIds = orderByProximity(chosen, start).map(c=>c.id);
      m.dirty = true; renderView();
    },
    mgrFilterAgendaAdd(){
      const input = document.getElementById('mgrAgendaAddSearch');
      state.mgrAgenda.search = input ? input.value : '';
      applyMgrAgendaAddFilter();
    },
    mgrSaveAgenda(){ return saveMgrAgenda(); },
  };
  App.saveAgenda = saveAgenda;
  window.App = App;

  /* ============ BOOT ============ */
  loadSession();
  if(state.session){ state.view = state.session.role==='manager' ? 'dashboard' : state.session.role==='supplier' ? 'sReport' : state.session.role==='orders' ? 'oDesk' : 'home'; }
  render();
  initDb();
})();
</script>


</body>
